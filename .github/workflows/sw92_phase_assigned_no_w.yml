name: SW92 phase-assigned no-W topology

# Main-target PR path matching is owned by pr_incremental_ci.yml. This file
# has no local PR path gate; it only executes routed or explicit manual validation.
on:
  workflow_call:
    inputs:
      dependencies_prevalidated:
        description: Central CI already validated fixed-family VLE dependency.
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: sw92-phase-assigned-no-w-${{ github.ref }}
  cancel-in-progress: true
jobs:
  no-w:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            runner: mpmc_hnu
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            runner: mpmc_hnu
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            runner: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Python interpreter
        run: |
          if command -v python >/dev/null 2>&1; then
            python_cmd="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_cmd="$(command -v python3)"
          else
            echo "Python interpreter not found" >&2
            exit 1
          fi
          echo "MPMC_PYTHON=$python_cmd" >> "$GITHUB_ENV"

      - name: Regenerate independent Decimal references
        run: |
          "$MPMC_PYTHON" tests/flash/sw92_family_vle/reference_decimal.py
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_joint/reference_decimal.py
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_no_w/reference_decimal.py

      - name: Configure Profile-C no-W
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_no_w -B build/sw92-phase-assigned-no-w \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_SW92_PHASE_ASSIGNED_NO_W_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build Profile-C no-W
        run: cmake --build build/sw92-phase-assigned-no-w --target mpmc_sw92_phase_assigned_no_w_tests --config ${{ matrix.config }} --parallel 2
      - name: Run Profile-C no-W
        run: ctest --test-dir build/sw92-phase-assigned-no-w -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_no_w[.]' --verbose --no-tests=error

      - name: Configure affected fixed-family VLE
        if: ${{ !inputs.dependencies_prevalidated }}
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_family_vle -B build/sw92-family-vle \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_SW92_FAMILY_VLE_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build affected fixed-family VLE
        if: ${{ !inputs.dependencies_prevalidated }}
        run: cmake --build build/sw92-family-vle --target mpmc_sw92_family_vle_tests --config ${{ matrix.config }} --parallel 2
      - name: Run affected fixed-family VLE
        if: ${{ !inputs.dependencies_prevalidated }}
        run: ctest --test-dir build/sw92-family-vle -C ${{ matrix.config }} -R '^flash[.]sw92_family_vle[.]' --verbose --no-tests=error
