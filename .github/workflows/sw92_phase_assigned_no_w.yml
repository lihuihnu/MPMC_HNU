name: SW92 phase-assigned no-W topology
on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/flash/include/mpmc/flash/pt_stability.hpp'
      - 'modules/flash/include/mpmc/flash/pt_split.hpp'
      - 'modules/flash/include/mpmc/flash/sw92_stability.hpp'
      - 'modules/flash/include/mpmc/flash/sw92_split.hpp'
      - 'modules/flash/include/mpmc/flash/sw92_phase_assigned_no_w.hpp'
      - 'modules/flash/sw92_phase_assigned_no_w.md'
      - 'modules/thermodynamics/**/*.hpp'
      - 'tests/flash/sw92_family_vle/**'
      - 'tests/flash/sw92_phase_assigned_joint/**'
      - 'tests/flash/sw92_phase_assigned_no_w/**'
      - '.github/workflows/sw92_phase_assigned_no_w.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sw92-phase-assigned-no-w-${{ github.ref }}
  cancel-in-progress: true
jobs:
  no-w:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Regenerate independent Decimal references
        run: |
          python tests/flash/sw92_family_vle/reference_decimal.py
          python tests/flash/sw92_phase_assigned_joint/reference_decimal.py
          python tests/flash/sw92_phase_assigned_no_w/reference_decimal.py

      - name: Configure Profile-C no-W
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_no_w -B build/sw92-phase-assigned-no-w \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_SW92_PHASE_ASSIGNED_NO_W_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build Profile-C no-W
        run: cmake --build build/sw92-phase-assigned-no-w --target mpmc_sw92_phase_assigned_no_w_tests --config ${{ matrix.config }} --parallel 2
      - name: Run Profile-C no-W
        run: ctest --test-dir build/sw92-phase-assigned-no-w -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_no_w[.]' --verbose --no-tests=error

      - name: Configure affected fixed-family VLE
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_family_vle -B build/sw92-family-vle \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_SW92_FAMILY_VLE_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build affected fixed-family VLE
        run: cmake --build build/sw92-family-vle --target mpmc_sw92_family_vle_tests --config ${{ matrix.config }} --parallel 2
      - name: Run affected fixed-family VLE
        run: ctest --test-dir build/sw92-family-vle -C ${{ matrix.config }} -R '^flash[.]sw92_family_vle[.]' --verbose --no-tests=error
