name: CPA PT density-root and fugacity kernel

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/thermodynamics/include/mpmc/thermodynamics/cpa_*.hpp'
      - 'modules/thermodynamics/include/mpmc/thermodynamics/selected_phase_fugacity.hpp'
      - 'modules/thermodynamics/cpa*.md'
      - 'tests/thermodynamics/cpa_pt_phase/**'
      - '.github/workflows/cpa_pt_phase.yml'
      - '.github/workflows/_cpp_ctest.yml'
      - 'tests/support/cmake/cpp_test_options.cmake'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpa-pt-phase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpa-pt-phase:
    uses: ./.github/workflows/_cpp_ctest.yml
    with:
      source_dir: tests/thermodynamics/cpa_pt_phase
      build_dir: build/cpa-pt-phase
      targets: mpmc_cpa_pt_phase_tests mpmc_cpa_pt_phase_headers
      test_regex: '^thermodynamics[.]cpa_pt_phase[.]'
      sanitizer_option: MPMC_CPA_PT_PHASE_ENABLE_SANITIZERS
      timeout_minutes: 30
