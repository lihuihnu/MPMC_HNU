name: PT flash backend conformance

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/flash/include/mpmc/flash/pt_flash_backend.hpp'
      - 'modules/flash/include/mpmc/flash/pr76_pt_flash_backend.hpp'
      - 'modules/flash/include/mpmc/flash/sw92_profile_c_pt_flash_backend.hpp'
      - 'modules/flash/include/mpmc/flash/cpa_pt_flash_backend.hpp'
      - 'modules/flash/include/mpmc/flash/pr76_*.hpp'
      - 'modules/flash/include/mpmc/flash/pt_*.hpp'
      - 'modules/flash/include/mpmc/flash/sw92_*.hpp'
      - 'modules/flash/include/mpmc/flash/cpa_*.hpp'
      - 'modules/flash/include/mpmc/flash/detail/**'
      - 'modules/thermodynamics/include/mpmc/thermodynamics/**'
      - 'tests/flash/pt_flash_backend/**'
      - 'tests/flash/pt_split/boundary_references.hpp'
      - 'tests/flash/pt_split/dew_limit_references.hpp'
      - 'tests/flash/pt_split/reference_boundary_decimal.py'
      - 'tests/flash/pt_split/reference_dew_limit_decimal.py'
      - 'tests/flash/pr76_three_phase/synthetic_fixture.hpp'
      - 'tests/flash/cpa_max3/test_support.hpp'
      - 'tests/flash/cpa_physical_validation/**'
      - 'tests/flash/sw92_phase_assigned_pt/physical_sample6.hpp'
      - 'tests/support/sw92/test_support.hpp'
      - '.github/workflows/pt_flash_backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pt-flash-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure PT flash backend conformance
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/pt_flash_backend \
            -B build/pt-flash-backend \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_PT_FLASH_BACKEND_ENABLE_SANITIZERS=${{ matrix.sanitizer }}

      - name: Build PT flash backend conformance
        run: cmake --build build/pt-flash-backend --target mpmc_pt_flash_backend_tests --config ${{ matrix.config }} --parallel 2

      - name: Run PT flash backend conformance
        run: ctest --test-dir build/pt-flash-backend -C ${{ matrix.config }} -R '^flash[.]pt_flash_backend[.]' --verbose --no-tests=error

      - name: Independently verify frozen PR76 near-dew references
        run: python tests/flash/pt_split/reference_dew_limit_decimal.py

      - name: Cross-check PR76 near-dew reference precision
        if: matrix.sanitizer == 'ON'
        run: python tests/flash/pt_split/reference_dew_limit_decimal.py --precision 96
