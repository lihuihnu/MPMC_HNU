name: CPA Clapeyron external oracle

on:
  pull_request:
    paths:
      - ".github/workflows/cpa_clapeyron_oracle.yml"
      - "tests/flash/cpa_clapeyron_oracle/**"
      - "tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json"

permissions:
  contents: read

concurrency:
  group: cpa-clapeyron-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-clapeyron-oracle:
    name: Pinned Clapeyron sCPA oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout MPMC_HNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: "1.10.12"

      - name: Checkout pinned Clapeyron
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ClapeyronThermo/Clapeyron.jl
          ref: 229b09452f36c2f812486150df0bb43b197bb4e5
          path: _external/Clapeyron.jl
          persist-credentials: false
          fetch-depth: 1

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C _external/Clapeyron.jl rev-parse HEAD)"
          expected="229b09452f36c2f812486150df0bb43b197bb4e5"
          test "${actual}" = "${expected}"
          test -z "$(git -C _external/Clapeyron.jl status --porcelain)"
          echo "CLAPEYRON_PIN_OK commit=${actual}"

      - name: Instantiate pinned Clapeyron
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        shell: bash
        run: |
          set -euo pipefail
          julia --project=_external/Clapeyron.jl \
            -e 'using Pkg; Pkg.instantiate()'

      - name: Audit formulation and generate ten-state oracle
        env:
          CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/cpa-clapeyron-oracle
          julia --project=_external/Clapeyron.jl \
            tests/flash/cpa_clapeyron_oracle/generate_oracle.jl \
            --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json \
            --out build/cpa-clapeyron-oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json
          test -z "$(git -C _external/Clapeyron.jl status --porcelain)"
          cat build/cpa-clapeyron-oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json

      - name: Verify frozen oracle reproduction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path(
              "build/cpa-clapeyron-oracle/"
              "clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json"
          ).read_text(encoding="utf-8"))
          frozen = json.loads(Path(
              "tests/flash/cpa_clapeyron_oracle/"
              "clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json"
          ).read_text(encoding="utf-8"))
          if generated != frozen:
              raise SystemExit("generated Clapeyron oracle differs from frozen reference")
          print("CLAPEYRON_ORACLE_FREEZE_MATCH_OK states=", len(generated["states"]))
          PY

      - name: Audit pinned Clapeyron derivative floor
        env:
          CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
        shell: bash
        run: |
          set -euo pipefail
          julia --project=_external/Clapeyron.jl \
            tests/flash/cpa_clapeyron_oracle/derivative_floor_audit.jl \
            --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json \
            --oracle tests/flash/cpa_clapeyron_oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json \
            --out build/cpa-clapeyron-oracle/clapeyron_derivative_floor_audit.json
          test -z "$(git -C _external/Clapeyron.jl status --porcelain)"
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path(
              "build/cpa-clapeyron-oracle/"
              "clapeyron_derivative_floor_audit.json"
          ).read_text(encoding="utf-8"))
          print("CLAPEYRON_DERIVATIVE_FLOOR_ARTIFACT",
                "states=", len(audit["states"]),
                "steps=", len(audit["frozen_relative_volume_steps"]))
          PY

      - name: Audit pinned Clapeyron BigFloat derivative floor
        env:
          CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
        shell: bash
        run: |
          set -euo pipefail
          julia --project=_external/Clapeyron.jl \
            tests/flash/cpa_clapeyron_oracle/bigfloat_derivative_audit.jl \
            --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json \
            --oracle tests/flash/cpa_clapeyron_oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json \
            --out build/cpa-clapeyron-oracle/clapeyron_bigfloat_derivative_audit.json
          test -z "$(git -C _external/Clapeyron.jl status --porcelain)"
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path(
              "build/cpa-clapeyron-oracle/"
              "clapeyron_bigfloat_derivative_audit.json"
          ).read_text(encoding="utf-8"))
          print("CLAPEYRON_BIGFLOAT_DERIVATIVE_ARTIFACT",
                "records=", len(audit["records"]),
                "precisions=", audit["precision_bits"],
                "states=", audit["problem_states"])
          PY

      - name: Audit state-4 association stationarity floor
        env:
          CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
        shell: bash
        run: |
          set -euo pipefail
          julia --project=_external/Clapeyron.jl \
            tests/flash/cpa_clapeyron_oracle/association_stationarity_floor_audit.jl \
            --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json \
            --oracle tests/flash/cpa_clapeyron_oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json \
            --out build/cpa-clapeyron-oracle/clapeyron_association_stationarity_floor_audit.json
          test -z "$(git -C _external/Clapeyron.jl status --porcelain)"
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path(
              "build/cpa-clapeyron-oracle/"
              "clapeyron_association_stationarity_floor_audit.json"
          ).read_text(encoding="utf-8"))
          print("CLAPEYRON_ASSOC_STATIONARITY_ARTIFACT",
                "records=", len(audit["records"]),
                "precisions=", audit["precision_bits"],
                "state=", audit["state"]["label"])
          PY

      - name: Audit pinned compressed exact2 independently
        env:
          CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
        shell: bash
        run: |
          set -euo pipefail
          julia --project=_external/Clapeyron.jl \
            tests/flash/cpa_clapeyron_oracle/independent_exact2_audit.jl \
            --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json \
            --oracle tests/flash/cpa_clapeyron_oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json \
            --out build/cpa-clapeyron-oracle/clapeyron_independent_exact2_audit.json
          test -z "$(git -C _external/Clapeyron.jl status --porcelain)"
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path(
              "build/cpa-clapeyron-oracle/"
              "clapeyron_independent_exact2_audit.json"
          ).read_text(encoding="utf-8"))
          print("CLAPEYRON_INDEPENDENT_EXACT2_ARTIFACT",
                "records=", len(audit["records"]),
                "precisions=", audit["precision_bits"],
                "state=", audit["state"]["label"])
          PY

      - name: Upload generated oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpa-clapeyron-oracle
          path: build/cpa-clapeyron-oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload derivative-floor audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpa-clapeyron-derivative-floor-audit
          path: build/cpa-clapeyron-oracle/clapeyron_derivative_floor_audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload BigFloat derivative audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpa-clapeyron-bigfloat-derivative-audit
          path: build/cpa-clapeyron-oracle/clapeyron_bigfloat_derivative_audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload association stationarity audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpa-clapeyron-association-stationarity-audit
          path: build/cpa-clapeyron-oracle/clapeyron_association_stationarity_floor_audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload independent exact2 audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpa-clapeyron-independent-exact2-audit
          path: build/cpa-clapeyron-oracle/clapeyron_independent_exact2_audit.json
          if-no-files-found: error
          retention-days: 7
