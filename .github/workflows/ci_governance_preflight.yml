name: CI governance preflight (candidate only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ci/migrate_governance.py'
      - '.github/workflows/ci_governance_preflight.yml'
permissions:
  contents: write
concurrency:
  group: ci-governance-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event.pull_request.number == 118 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned YAML validator
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Build and audit candidate without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/ci_governance_preflight.yml
          python3 .github/ci/migrate_governance.py
