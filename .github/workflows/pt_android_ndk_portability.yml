name: PT Android NDK portability
permissions:
  contents: read
concurrency:
  group: pt-android-ndk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  incremental-path-gate:
    name: Incremental path gate
    uses: ./.github/workflows/_incremental_path_gate.yml
    with:
      paths_json: '["modules/ad/**","modules/thermodynamics/**","modules/flash/**","modules/runtime/**","modules/model_configuration/**","modules/pt_process/src/configured_backends.cpp","modules/pt_process/src/parameter_snapshot_supplier.cpp","modules/pt_process/include/mpmc/pt_process/configured_backends.hpp","modules/pt_process/include/mpmc/pt_process/parameter_snapshot_supplier.hpp","products/pt_android/**",".github/workflows/pt_android_ndk_portability.yml"]'
  boundary:
    needs: incremental-path-gate
    if: needs.incremental-path-gate.outputs.affected == 'true'
    name: Android isolation contract
    runs-on:
    - self-hosted
    - linux
    - x64
    - mpmc_hnu
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Validate isolated Android boundary
      run: python -m unittest discover -s products/pt_android/tests -p 'test_*.py' -v
  build:
    name: Android ${{ matrix.abi }} native runtime
    needs: boundary
    runs-on:
    - self-hosted
    - linux
    - x64
    - mpmc_hnu
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - abi: arm64-v8a
          machine: AArch64
        - abi: x86_64
          machine: Advanced Micro Devices X86-64
    env:
      NDK_VERSION: 30.0.16248370
      ANDROID_API: 26
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Ensure exact Android NDK
      shell: bash
      run: "set -euo pipefail\nsdk_root=\"${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}\"\nif [[ -z \"$sdk_root\" ]]; then\n  echo 'Android SDK root is unavailable on the\
        \ hosted runner.' >&2\n  exit 1\nfi\nsdkmanager=\"$sdk_root/cmdline-tools/latest/bin/sdkmanager\"\nif [[ ! -x \"$sdkmanager\" ]]; then\n  echo \"sdkmanager\
        \ is unavailable: $sdkmanager\" >&2\n  exit 1\nfi\nndk_home=\"$sdk_root/ndk/$NDK_VERSION\"\nif [[ ! -d \"$ndk_home\" ]]; then\n  yes | \"$sdkmanager\" --licenses\
        \ >/dev/null || true\n  \"$sdkmanager\" --install \"ndk;$NDK_VERSION\"\nfi\ntest -f \"$ndk_home/build/cmake/android.toolchain.cmake\"\necho \"MPMC_ANDROID_NDK_HOME=$ndk_home\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Configure isolated Android core
      shell: bash
      run: "set -euo pipefail\ncmake \\\n  -S products/pt_android \\\n  -B \"build/pt-android-${{ matrix.abi }}\" \\\n  -DCMAKE_TOOLCHAIN_FILE=\"$MPMC_ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake\"\
        \ \\\n  -DANDROID_ABI=${{ matrix.abi }} \\\n  -DANDROID_PLATFORM=android-26 \\\n  -DANDROID_STL=c++_static \\\n  -DCMAKE_BUILD_TYPE=Release\n"
    - name: Build Android shared core
      run: cmake --build "build/pt-android-${{ matrix.abi }}" --config Release --parallel 2
    - name: Validate ELF architecture and exported ABI
      shell: bash
      run: "set -euo pipefail\nmapfile -t libraries < <(\n  find \"build/pt-android-${{ matrix.abi }}\" \\\n    -type f -name 'libmpmc_pt_android_core.so' -print\n\
        )\nif [[ ${#libraries[@]} -ne 1 ]]; then\n  printf 'Expected exactly one Android core library, found %s\\n' \"${#libraries[@]}\" >&2\n  exit 1\nfi\nlibrary=\"\
        ${libraries[0]}\"\ntoolchain=\"$MPMC_ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin\"\n\"$toolchain/llvm-readelf\" -h \"$library\" | tee \"build/android-${{\
        \ matrix.abi }}-elf.txt\"\n\"$toolchain/llvm-readelf\" -h \"$library\" | grep -F \"Machine:\" | grep -F '${{ matrix.machine }}'\n\"$toolchain/llvm-nm\" -D\
        \ --defined-only \"$library\" | grep -F 'mpmc_pt_android_core_abi_version'\n\"$toolchain/llvm-nm\" -D --defined-only \"$library\" | grep -F 'mpmc_pt_android_core_convention'\n\
        \"$toolchain/llvm-nm\" -D --defined-only \"$library\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_runSmoke'\n\"$toolchain/llvm-nm\" -D --defined-only\
        \ \"$library\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_discoverJson'\n\"$toolchain/llvm-nm\" -D --defined-only \"$library\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_solveJson'\n\
        \"$toolchain/llvm-nm\" -D --defined-only \"$library\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_modelApplyRecords'\n\"$toolchain/llvm-nm\" -D --defined-only\
        \ \"$library\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_modelSolveRecords'\n\"$toolchain/llvm-nm\" -D --defined-only \"$library\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_modelReleaseRecords'\n\
        \"$toolchain/llvm-nm\" -D --defined-only \"$library\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_modelCancel'\ncp \"$library\" \"build/libmpmc_pt_android_core-${{\
        \ matrix.abi }}.so\"\necho 'ANDROID_NDK_PT_CORE_PORTABILITY_OK abi=${{ matrix.abi }}'\n"
    - name: Upload Android portability library
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mpmc-pt-android-${{ matrix.abi }}-native-v3
        path: 'build/libmpmc_pt_android_core-${{ matrix.abi }}.so

          build/android-${{ matrix.abi }}-elf.txt

          '
        if-no-files-found: error
        retention-days: 7
'on':
  workflow_dispatch: null
