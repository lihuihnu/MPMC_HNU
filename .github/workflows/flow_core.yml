name: Flow natural-variable core contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            runner: ubuntu-24.04
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            runner: ubuntu-24.04
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            runner: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure flow core contract
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flow/core \
            -B build/flow-core \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_FLOW_ENABLE_SANITIZERS=${{ matrix.sanitizer }}

      - name: Build flow core contract
        run: |
          cmake --build build/flow-core \
            --target mpmc_flow_core_tests mpmc_flow_phase_transition_tests mpmc_flow_fugacity_tests mpmc_flow_absent_phase_thermodynamics_tests mpmc_flow_fugacity_linearization_tests mpmc_flow_pr76_selected_phase_property_tests mpmc_flow_accumulation_tests mpmc_flow_accumulation_time_tests mpmc_flow_energy_accumulation_tests mpmc_flow_saturation_constitutive_tests mpmc_flow_phase_transport_tests mpmc_flow_phase_potential_tests \
            --config ${{ matrix.config }} \
            --parallel 2

      - name: Run flow core contract
        run: |
          ctest --test-dir build/flow-core \
            -C ${{ matrix.config }} \
            -R '^flow[.](core|phase_transition|fugacity|absent_phase_thermodynamics|fugacity_linearization|pr76_selected_phase_property|accumulation|accumulation_time|energy_accumulation|constitutive|transport|potential)[.]' \
            --verbose \
            --no-tests=error

      - name: Recompute independent Li-Firoozabadi flow oracle
        if: matrix.name == 'GCC Debug + ASan/UBSan'
        run: |
          python3 tests/flow/core/reference_li_firoozabadi_sour_gas_flow.py --precision 80
          python3 tests/flow/core/reference_li_firoozabadi_sour_gas_flow.py --precision 96
