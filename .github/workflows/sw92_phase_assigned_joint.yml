name: SW92 phase-assigned AQ/NA joint

# Main-target PR path matching is owned by pr_incremental_ci.yml. This file
# has no local PR path gate; it only executes routed or explicit manual validation.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: sw92-phase-assigned-joint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  c1:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            runner: mpmc_hnu
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            runner: mpmc_hnu
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            runner: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure Profile-C Gate C1
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_joint -B build/sw92-phase-assigned-joint \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_SW92_PHASE_ASSIGNED_JOINT_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build Profile-C Gate C1
        run: cmake --build build/sw92-phase-assigned-joint --target mpmc_sw92_phase_assigned_joint_tests --config ${{ matrix.config }} --parallel 2
      - name: Run Profile-C Gate C1
        run: ctest --test-dir build/sw92-phase-assigned-joint -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_joint[.]' --verbose --no-tests=error

      - name: Select Python interpreter
        run: |
          if command -v python >/dev/null 2>&1; then
            python_cmd="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_cmd="$(command -v python3)"
          else
            echo "Python interpreter not found" >&2
            exit 1
          fi
          echo "MPMC_PYTHON=$python_cmd" >> "$GITHUB_ENV"

      - name: Regenerate independent Decimal references
        run: |
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_joint/reference_decimal.py
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_joint/reference_c2_domain_decimal.py
