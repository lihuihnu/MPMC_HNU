name: CI entry migration validation
on:
  push:
    branches: [work/ci-single-entry-20260921]
permissions:
  contents: write
concurrency:
  group: entry-migration-validation
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned metadata validators
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Audit every entry and publish an immutable candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/ci/_entry_migration_stage.py /tmp/entry_migration.py
          git reset --hard bcf2ce8dfaa8fd6f63749db1fac1db6dfb571a6f
          python3 /tmp/entry_migration.py
