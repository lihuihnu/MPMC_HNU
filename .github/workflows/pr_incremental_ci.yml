        \ \\\n  -path '*/Contents/Packages/*' -type f \\\n  -name 'MPMC PT Runtime' -print -quit)\ntest -n \"$component\"\nexpanded=\"$RUNNER_TEMP/mpmc-pt-component-expanded\"\
