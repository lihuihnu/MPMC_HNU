# candidate-head: 5d4898d9df4ec83eeeb8c91cf29605da5959702d actionlint-configured
name: CI governance candidate validation
on:
  push:
    branches: [work/ci-single-entry-20260921]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/ci-governance-fix-20260921
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned validators
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate governance candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile             .github/ci/impact_rules.py             .github/ci/plan.py             .github/ci/verify_workflows.py             .github/ci/verify_result.py
          python3 .github/ci/verify_workflows.py
          cat > /tmp/actionlint.yaml <<'EOF'
          self-hosted-runner:
            labels:
              - mpmc_hnu
          EOF
          actionlint -config-file /tmp/actionlint.yaml .github/workflows/*.yml
          git diff --check f4f11807d3476aac6d3e19f2afcd98863d05a7c4..HEAD
          bad="$(git diff --name-only f4f11807d3476aac6d3e19f2afcd98863d05a7c4..HEAD | grep -Ev '^\.github/' || true)"
          test -z "$bad" || { echo "non-governance changes: $bad" >&2; exit 1; }
          cat > /tmp/pr-event.json <<EOF
          {
            "action": "synchronize",
            "pull_request": {
              "number": 118,
              "base": {"sha": "256b24edffb5b66433f5dcc6984d61072ac11328", "ref": "main"},
              "head": {
                "sha": "$(git rev-parse HEAD)",
                "ref": "work/ci-governance-fix-20260921",
                "repo": {"full_name": "lihuihnu/MPMC_HNU"}
              }
            }
          }
          EOF
          : > /tmp/planner-output
          GITHUB_EVENT_PATH=/tmp/pr-event.json           GITHUB_EVENT_NAME=pull_request           GITHUB_REPOSITORY=lihuihnu/MPMC_HNU           GITHUB_OUTPUT=/tmp/planner-output           python3 .github/ci/plan.py
          test -s /tmp/planner-output
          echo "CI_GOVERNANCE_CANDIDATE_OK"
