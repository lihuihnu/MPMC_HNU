          def compile_pattern(pattern):
              out = ["^"]
              i = 0
              while i < len(pattern):
                  if pattern[i:i + 3] == "**/":
                      out.append("(?:.*/)?")
                      i += 3
                  elif pattern[i:i + 2] == "**":
                      out.append(".*")
                      i += 2
                  elif pattern[i] == "*":
                      out.append("[^/]*")
                      i += 1
                  elif pattern[i] == "?":
                      out.append("[^/]")
                      i += 1
                  else:
                      out.append(re.escape(pattern[i]))
                      i += 1
              out.append("$")
              return re.compile("".join(out))

          compiled = {
              gate: [compile_pattern(pattern) for pattern in patterns]
              for gate, patterns in ownership.items()
          }

          def route(paths):
              result = {
                  gate: any(
                      pattern.match(path)
                      for path in paths
                      for pattern in patterns
                  )
                  for gate, patterns in compiled.items()
              }
              return result

