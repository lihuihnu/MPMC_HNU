  legacy_cpa_performance_audit__paired-baseline:
    needs:
    - impact
    name: CPA flash performance audit / main vs PR head / private Linux x64
    runs-on:
    - self-hosted
    - linux
    - x64
    - mpmc_hnu
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout PR head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Record compared revisions and create main worktree
      run: "set -euo pipefail\ngit fetch origin main:refs/remotes/origin/main\nhead_sha=\"$(git rev-parse HEAD)\"\nmain_sha=\"$(git rev-parse origin/main)\"\nmain_root=\"\
        ${RUNNER_TEMP}/mpmc-main\"\ngit worktree add --detach \"${main_root}\" \"${main_sha}\"\n{\n  echo \"CPA_PERF_HEAD_SHA=${head_sha}\"\n  echo \"CPA_PERF_MAIN_SHA=${main_sha}\"\
        \n  echo \"CPA_PERF_MAIN_ROOT=${main_root}\"\n} >> \"${GITHUB_ENV}\"\necho \"head=${head_sha}\"\necho \"main=${main_sha}\"\nclang++ --version | head -n 1\n\
        g++ --version | head -n 1\ncmake --version | head -n 1\n"
    - name: Configure paired Clang Release binaries
      run: "set -euo pipefail\ncmake -S tests/flash/cpa_performance_baseline \\\n  -B build/cpa-perf-head \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_CXX_COMPILER=clang++\
        \ \\\n  -DMPMC_SOURCE_ROOT=\"${GITHUB_WORKSPACE}\"\ncmake -S tests/flash/cpa_performance_baseline \\\n  -B build/cpa-perf-main \\\n  -DCMAKE_BUILD_TYPE=Release\
        \ \\\n  -DCMAKE_CXX_COMPILER=clang++ \\\n  -DMPMC_SOURCE_ROOT=\"${CPA_PERF_MAIN_ROOT}\"\n"
    - name: Build paired Clang Release binaries
      run: 'cmake --build build/cpa-perf-head --parallel 2

        cmake --build build/cpa-perf-main --parallel 2

        '
    - name: Capture deterministic high-level solver counts
      run: "set -euo pipefail\nmkdir -p build/cpa-perf-results\nbuild/cpa-perf-main/mpmc_cpa_performance_baseline structure \\\n  | tee build/cpa-perf-results/structure-main.log\n\
        build/cpa-perf-head/mpmc_cpa_performance_baseline structure \\\n  | tee build/cpa-perf-results/structure-head.log\n"
    - name: Measure repeated micro hot-path timings
      run: "set -euo pipefail\nlog=build/cpa-perf-results/micro.log\n: > \"${log}\"\nfor sample in 1 2 3 4 5; do\n  if (( sample % 2 == 1 )); then refs=(main head);\
        \ else refs=(head main); fi\n  for ref in \"${refs[@]}\"; do\n    exe=\"build/cpa-perf-${ref}/mpmc_cpa_performance_baseline\"\n    line=\"$(\"${exe}\" micro)\"\
        \n    echo \"ref=${ref} sample=${sample} ${line}\" | tee -a \"${log}\"\n  done\ndone\n"
    - name: Measure repeated five-state full-flash timings
      run: "set -euo pipefail\nlog=build/cpa-perf-results/full.log\n: > \"${log}\"\nfor sample in 1 2 3; do\n  if (( sample % 2 == 1 )); then refs=(main head); else\
        \ refs=(head main); fi\n  for ref in \"${refs[@]}\"; do\n    exe=\"build/cpa-perf-${ref}/mpmc_cpa_performance_baseline\"\n    line=\"$(\"${exe}\" full)\"\n\
        \    echo \"ref=${ref} sample=${sample} ${line}\" | tee -a \"${log}\"\n  done\ndone\n"
    - name: Configure paired GCC Release coverage counters
      run: "set -euo pipefail\ncmake -S tests/flash/cpa_performance_baseline \\\n  -B build/cpa-perf-head-coverage \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_CXX_COMPILER=g++\
        \ \\\n  -DMPMC_CPA_PERF_ENABLE_COVERAGE=ON \\\n  -DMPMC_SOURCE_ROOT=\"${GITHUB_WORKSPACE}\"\ncmake -S tests/flash/cpa_performance_baseline \\\n  -B build/cpa-perf-main-coverage\
        \ \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_CXX_COMPILER=g++ \\\n  -DMPMC_CPA_PERF_ENABLE_COVERAGE=ON \\\n  -DMPMC_SOURCE_ROOT=\"${CPA_PERF_MAIN_ROOT}\"\
        \ncmake --build build/cpa-perf-head-coverage --parallel 2\ncmake --build build/cpa-perf-main-coverage --parallel 2\n"
    - name: Count exact production hot-path executions with gcov
      run: "set -euo pipefail\nbuild/cpa-perf-main-coverage/mpmc_cpa_performance_baseline structure \\\n  > build/cpa-perf-results/coverage-workload-main.log\npython3\
        \ tests/flash/cpa_performance_baseline/collect_gcov_counts.py \\\n  --object-dir build/cpa-perf-main-coverage/CMakeFiles/mpmc_cpa_performance_baseline.dir\
        \ \\\n  --benchmark-source tests/flash/cpa_performance_baseline/benchmark.cpp \\\n  --source-root \"${CPA_PERF_MAIN_ROOT}\" \\\n  --label main \\\n  --output\
        \ build/cpa-perf-results/coverage-main.json\n\nbuild/cpa-perf-head-coverage/mpmc_cpa_performance_baseline structure \\\n  > build/cpa-perf-results/coverage-workload-head.log\n\
        python3 tests/flash/cpa_performance_baseline/collect_gcov_counts.py \\\n  --object-dir build/cpa-perf-head-coverage/CMakeFiles/mpmc_cpa_performance_baseline.dir\
        \ \\\n  --benchmark-source tests/flash/cpa_performance_baseline/benchmark.cpp \\\n  --source-root \"${GITHUB_WORKSPACE}\" \\\n  --label head \\\n  --output\
        \ build/cpa-perf-results/coverage-head.json\n"
    - name: Summarize baseline without creating a performance gate
      run: "set -euo pipefail\npython3 tests/flash/cpa_performance_baseline/summarize.py \\\n  --full-log build/cpa-perf-results/full.log \\\n  --micro-log build/cpa-perf-results/micro.log\
        \ \\\n  --main-structure build/cpa-perf-results/structure-main.log \\\n  --head-structure build/cpa-perf-results/structure-head.log \\\n  --main-coverage\
        \ build/cpa-perf-results/coverage-main.json \\\n  --head-coverage build/cpa-perf-results/coverage-head.json \\\n  --main-sha \"${CPA_PERF_MAIN_SHA}\" \\\n\
        \  --head-sha \"${CPA_PERF_HEAD_SHA}\" \\\n  --markdown build/cpa-perf-results/report.md \\\n  --json build/cpa-perf-results/report.json \\\n  | tee build/cpa-perf-results/summary.log\n\
        cat build/cpa-perf-results/report.md >> \"${GITHUB_STEP_SUMMARY}\"\n"
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.impact.outputs.trusted == 'true' && needs.impact.outputs.legacy_cpa_performance_audit
      == 'true' && ('true' == 'true')
    permissions:
      contents: read
    concurrency:
      group: cpa-performance-audit-${{ github.ref }}-legacy_cpa_performance_audit__paired-baseline
      cancel-in-progress: false
  legacy_cpa_thermopack_oracle__pinned-thermopack-oracle:
    needs:
    - impact
    name: CPA ThermoPack external oracle / Pinned ThermoPack SRK-CPA oracle
    runs-on:
    - self-hosted
    - linux
    - x64
    - mpmc_hnu
    timeout-minutes: 30
    steps:
    - name: Checkout MPMC_HNU
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare hosted ThermoPack build prerequisites
      shell: bash
      run: 'set -euo pipefail

        gfortran --version | head -n 1

        cmake --version | head -n 1

        python3 --version

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends liblapack-dev libblas-dev

        '
    - name: Fetch pinned ThermoPack source
      shell: bash
      run: "set -euo pipefail\nrevision=d68c794c7342bfc6938eb424a1fbb88b7780b738\nrm -rf build/thermopack\ngit init build/thermopack\ngit -C build/thermopack remote\
        \ add origin https://github.com/thermotools/thermopack.git\nfor attempt in 1 2 3; do\n  if git -C build/thermopack \\\n      -c http.version=HTTP/1.1 \\\n\
        \      fetch --no-tags --depth=1 origin \"$revision\"; then\n    break\n  fi\n  if [ \"$attempt\" -eq 3 ]; then\n    echo \"Pinned ThermoPack fetch failed\
        \ after 3 attempts\" >&2\n    exit 1\n  fi\n  rm -rf build/thermopack/.git/objects/pack/*\n  sleep $((attempt * 5))\ndone\ngit -C build/thermopack checkout\
        \ --detach FETCH_HEAD\ntest \"$(git -C build/thermopack rev-parse HEAD)\" = \"$revision\"\n"
    - name: Build pinned ThermoPack
      shell: bash
      run: 'set -euo pipefail

        cmake -S build/thermopack -B build/thermopack-build -DCMAKE_BUILD_TYPE=Release

        cmake --build build/thermopack-build --parallel 2

        cmake --install build/thermopack-build

        '
    - name: Configure ThermoPack Python wrapper
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --user numpy

        python3 build/thermopack/addon/pycThermopack/map_platform_specifics.py --diffs=v3

        python3 -m pip install --disable-pip-version-check --user --no-deps build/thermopack/addon/pycThermopack/

        '
    - name: Generate formulation-matched CPA oracle
      shell: bash
      run: "set -euo pipefail\npython3 tests/flash/cpa_thermopack_oracle/generate_oracle.py \\\n  --out build/cpa-thermopack-oracle.json\ntest -s build/cpa-thermopack-oracle.json\n"
    - name: Verify frozen external oracle reproducibility
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json\nimport math\nfrom pathlib import Path\n\nactual = json.loads(Path(\"build/cpa-thermopack-oracle.json\"\
        ).read_text())\nfrozen = json.loads(Path(\n    \"tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_33315k.json\"\n).read_text())\n\nfor key in\
        \ (\"schema\", \"generator\", \"model\"):\n    if actual[key] != frozen[key]:\n        raise SystemExit(f\"frozen ThermoPack oracle metadata drifted at {key}\"\
        )\nif len(actual[\"states\"]) != len(frozen[\"states\"]):\n    raise SystemExit(\"frozen ThermoPack oracle state count drifted\")\n\nexact_keys = (\"phase_code\"\
        , \"pressure_pa\", \"temperature_k\")\nscalar_keys = (\"beta_liquid\", \"beta_vapor\", \"extraction_material_balance_max_abs\")\nmaps = (\"feed\", \"liquid\"\
        , \"vapor\")\nfor index, (got, ref) in enumerate(zip(actual[\"states\"], frozen[\"states\"])):\n    for key in exact_keys:\n        if got[key] != ref[key]:\n\
        \            raise SystemExit(f\"oracle state {index} exact field drifted: {key}\")\n    for key in scalar_keys:\n        if not math.isclose(got[key], ref[key],\
        \ rel_tol=2e-12, abs_tol=2e-12):\n            raise SystemExit(f\"oracle state {index} scalar drifted: {key}\")\n    for group in maps:\n        if got[group].keys()\
        \ != ref[group].keys():\n            raise SystemExit(f\"oracle state {index} component keys drifted: {group}\")\n        for component in got[group]:\n \
        \           if not math.isclose(got[group][component], ref[group][component],\n                                rel_tol=2e-12, abs_tol=2e-12):\n          \
        \      raise SystemExit(f\"oracle state {index} {group}/{component} drifted\")\nprint(\"THERMOPACK_CPA_FROZEN_ORACLE_OK states=5 tolerance=2e-12\")\nPY\n"
    - name: Generate phase-kernel decomposition audit
      shell: bash
      run: "set -euo pipefail\npython3 tests/flash/cpa_thermopack_oracle/generate_phase_kernel_audit.py \\\n  --thermopack-source build/thermopack \\\n  --out build/cpa-thermopack-phase-kernel-audit.json\n\
        test -s build/cpa-thermopack-phase-kernel-audit.json\n"
    - name: Verify frozen phase-kernel reference
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json\nimport math\nfrom pathlib import Path\n\nactual = json.loads(Path(\"build/cpa-thermopack-phase-kernel-audit.json\"\
        ).read_text())\nfrozen = json.loads(Path(\n    \"tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json\"\n).read_text())\n\
        \nif frozen[\"schema\"] != \"MPMC_HNU/CPA/ThermoPack-phase-kernel-reference/v2\":\n    raise SystemExit(\"unexpected frozen phase-kernel reference schema\"\
        )\nif actual[\"schema\"] != frozen[\"source\"][\"generated_schema\"]:\n    raise SystemExit(\"phase-kernel generated schema drifted\")\nif actual[\"generator\"\
        ][\"commit\"] != frozen[\"source\"][\"commit\"]:\n    raise SystemExit(\"phase-kernel ThermoPack revision drifted\")\nif actual[\"generator\"][\"software\"\
        ] != frozen[\"source\"][\"software\"]:\n    raise SystemExit(\"phase-kernel software identity drifted\")\nif len(actual[\"states\"]) != len(frozen[\"states\"\
        ]):\n    raise SystemExit(\"phase-kernel state count drifted\")\n\ndef close(got, ref, where):\n    if not math.isclose(float(got), float(ref), rel_tol=2e-12,\
        \ abs_tol=2e-12):\n        raise SystemExit(f\"phase-kernel frozen reference drifted at {where}: {got} vs {ref}\")\n\nclose(actual[\"gas_constant_j_per_mol_k\"\
        ], frozen[\"gas_constant_j_per_mol_k\"], \"R\")\nfor component in (\"MEOH\", \"H2O\"):\n    got_tc = actual[\"alpha_critical_temperature_source\"][component]\n\
        \    ref_tc = frozen[\"alpha_critical_temperature_source\"][component]\n    close(got_tc[\"temperature_k\"], ref_tc[\"temperature_k\"], f\"Tc/{component}\"\
        )\n    if got_tc[\"ref\"] != ref_tc[\"ref\"] or got_tc[\"source_file\"] != ref_tc[\"source_file\"]:\n        raise SystemExit(f\"phase-kernel Tc provenance\
        \ drifted for {component}\")\n\nscalar_fields = (\n    \"molar_density_mol_per_m3\", \"compressibility_factor\",\n    \"pressure_physical_pa\", \"pressure_association_pa\"\
        ,\n)\nmaps = (\"composition\", \"ln_phi\", \"mu_cubic_over_rt\", \"mu_association_over_rt\")\nfor index, (got_state, ref_state) in enumerate(zip(actual[\"\
        states\"], frozen[\"states\"])):\n    close(got_state[\"temperature_k\"], ref_state[\"temperature_k\"], f\"{index}/T\")\n    close(got_state[\"pressure_pa\"\
        ], ref_state[\"pressure_pa\"], f\"{index}/P\")\n    for phase in (\"liquid\", \"vapor\"):\n        got = got_state[phase]\n        ref = ref_state[phase]\n\
        \        for key in scalar_fields:\n            close(got[key], ref[key], f\"{index}/{phase}/{key}\")\n        for group in maps:\n            for component\
        \ in (\"MEOH\", \"H2O\"):\n                close(got[group][component], ref[group][component],\n                      f\"{index}/{phase}/{group}/{component}\"\
        )\nprint(\"THERMOPACK_CPA_PHASE_KERNEL_REFERENCE_OK states=5 phase_states=10 tolerance=2e-12\")\nPY\n"
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.impact.outputs.trusted == 'true' && needs.impact.outputs.legacy_cpa_thermopack_oracle
      == 'true' && ('true' == 'true')
    permissions:
      contents: read
    concurrency:
      group: cpa-thermopack-oracle-${{ github.event.pull_request.number || github.ref }}-legacy_cpa_thermopack_oracle__pinned-thermopack-oracle
      cancel-in-progress: true
