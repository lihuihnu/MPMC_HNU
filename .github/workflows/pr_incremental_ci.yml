name: PR incremental CI router

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-incremental-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Compute current PR update impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      flow_core: ${{ steps.route.outputs.flow_core }}
      flow_discretization: ${{ steps.route.outputs.flow_discretization }}
      flow_discretization_petsc: ${{ steps.route.outputs.flow_discretization_petsc }}
      ad_has_work: ${{ steps.route.outputs.ad_has_work }}
      ad_matrix: ${{ steps.route.outputs.ad_matrix }}
      pt_flash_backend: ${{ steps.route.outputs.pt_flash_backend }}
      pt_stability: ${{ steps.route.outputs.pt_stability }}
      pt_split: ${{ steps.route.outputs.pt_split }}
      pr76_pt_continuation: ${{ steps.route.outputs.pr76_pt_continuation }}
      pr76_max3: ${{ steps.route.outputs.pr76_max3 }}
      cpa_stability: ${{ steps.route.outputs.cpa_stability }}
      cpa_split: ${{ steps.route.outputs.cpa_split }}
      cpa_max3: ${{ steps.route.outputs.cpa_max3 }}
      cpa_baseline: ${{ steps.route.outputs.cpa_baseline }}
      cpa_pt_phase: ${{ steps.route.outputs.cpa_pt_phase }}
      cpa_physical_validation: ${{ steps.route.outputs.cpa_physical_validation }}
      thermo_has_work: ${{ steps.route.outputs.thermo_has_work }}
      thermo_matrix: ${{ steps.route.outputs.thermo_matrix }}
      physics_closure: ${{ steps.route.outputs.physics_closure }}
      model_configuration: ${{ steps.route.outputs.model_configuration }}
      sw92_thermodynamics: ${{ steps.route.outputs.sw92_thermodynamics }}
      sw92_family_vle: ${{ steps.route.outputs.sw92_family_vle }}
      sw92_profile_c_pt: ${{ steps.route.outputs.sw92_profile_c_pt }}
      sw92_profile_c_phase_set: ${{ steps.route.outputs.sw92_profile_c_phase_set }}
      sw92_profile_c_sensitivity: ${{ steps.route.outputs.sw92_profile_c_sensitivity }}
      sw92_physics_closure: ${{ steps.route.outputs.sw92_physics_closure }}
      sw92_phase_assigned_joint: ${{ steps.route.outputs.sw92_phase_assigned_joint }}
      sw92_phase_assigned_h_side_witness: ${{ steps.route.outputs.sw92_phase_assigned_h_side_witness }}
      sw92_phase_assigned_no_w: ${{ steps.route.outputs.sw92_phase_assigned_no_w }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Route one PR diff to audited CI gates
        id: route
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import json
          import os
          import re
          import subprocess

          router_path = ".github/workflows/pr_incremental_ci.yml"
          all_ad_suites = ["arithmetic", "jacobian", "math", "runtime"]
          ad_platforms = [
              {"name": "GCC Debug + ASan/UBSan", "os": "ubuntu-24.04", "runner": "mpmc_hnu",
               "build_type": "Debug", "compiler": "-DCMAKE_CXX_COMPILER=g++", "sanitizer": "ON"},
              {"name": "Clang Release", "os": "ubuntu-24.04", "runner": "mpmc_hnu",
               "build_type": "Release", "compiler": "-DCMAKE_CXX_COMPILER=clang++", "sanitizer": "OFF"},
              {"name": "MSVC Release", "os": "windows-2022", "runner": "windows-2022",
               "build_type": "Release", "compiler": "", "sanitizer": "OFF"},
          ]

          all_thermo_suites = ["contracts", "pr76", "pr76_mixture", "pr76_pt"]
          thermo_platforms = [
              {"name": "GCC Debug + ASan/UBSan", "os": "ubuntu-24.04", "runner": "mpmc_hnu",
               "config": "Debug", "compiler": "-DCMAKE_CXX_COMPILER=g++", "sanitizer": "ON"},
              {"name": "Clang Release", "os": "ubuntu-24.04", "runner": "mpmc_hnu",
               "config": "Release", "compiler": "-DCMAKE_CXX_COMPILER=clang++", "sanitizer": "OFF"},
              {"name": "MSVC Release", "os": "windows-2022", "runner": "windows-2022",
               "config": "Release", "compiler": "", "sanitizer": "OFF"},
          ]
          thermo_targets = {
              "contracts": "mpmc_thermodynamics_contract_tests",
              "pr76": "mpmc_thermodynamics_pr76_tests",
              "pr76_mixture": "mpmc_thermodynamics_pr76_mixture_tests",
              "pr76_pt": "mpmc_thermodynamics_pr76_pt_tests",
          }

          ownership = {
              "flow_core": [
                  "modules/flow/**",
                  "modules/thermodynamics/CMakeLists.txt",
                  "modules/thermodynamics/include/mpmc/thermodynamics/selected_phase_fugacity.hpp",
