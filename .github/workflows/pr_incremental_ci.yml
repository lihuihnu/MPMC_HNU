name: Routed reusable result validation
on:
  push:
    branches: [work/ci-single-entry-20260921]

permissions:
  contents: read

jobs:
  ad:
    uses: lihuihnu/MPMC_HNU/.github/workflows/ad.yml@c31c64a1003f60fb2118b354555f946cc8cb08cc
    with:
      matrix_json: '{"include":[{"name":"GCC Debug + ASan/UBSan","os":"ubuntu-24.04","runner":"ubuntu-24.04","build_type":"Debug","compiler":"-DCMAKE_CXX_COMPILER=g++","sanitizer":"ON","suite":"arithmetic"}]}'

  pt-stability:
    uses: lihuihnu/MPMC_HNU/.github/workflows/stability.yml@c31c64a1003f60fb2118b354555f946cc8cb08cc
    with:
      routed: true

  verify:
    needs: [ad, pt-stability]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify reusable caller evidence
        env:
          AD_RESULT: ${{ needs.ad.result }}
          AD_VALIDATED: ${{ needs.ad.outputs.validated }}
          STABILITY_RESULT: ${{ needs.pt-stability.result }}
          STABILITY_VALIDATED: ${{ needs.pt-stability.outputs.validated }}
        run: |
          set -euo pipefail
          echo "ad_result=$AD_RESULT ad_validated=$AD_VALIDATED"
          echo "stability_result=$STABILITY_RESULT stability_validated=$STABILITY_VALIDATED"
          test "$AD_RESULT" = "success"
          test "$AD_VALIDATED" = "true"
          test "$STABILITY_RESULT" = "success"
          test "$STABILITY_VALIDATED" = "true"
          echo "ROUTED_REUSABLE_RESULT_OK"
