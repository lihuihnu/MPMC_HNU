      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      shell: python
      run: 'import json, os

        needs = json.loads(os.environ[''NEEDS_JSON''])

        assert needs[''impact''][''result''] == ''success'', ''impact did not complete''

        assert needs[''impact''][''outputs''].get(''trusted'') == ''true'', ''fork validation requires trusted execution''

        failed = {k:v[''result''] for k,v in needs.items() if v[''result''] not in (''success'', ''skipped'')}

