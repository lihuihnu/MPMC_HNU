name: CI - affected tests v2
permissions:
  contents: read
  actions: read
concurrency:
  group: pr-incremental-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    name: Compute current PR update impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      flow_core: ${{ steps.route.outputs.flow_core }}
      flow_discretization: ${{ steps.route.outputs.flow_discretization }}
      flow_discretization_petsc: ${{ steps.route.outputs.flow_discretization_petsc }}
      ad_has_work: ${{ steps.route.outputs.ad_has_work }}
      ad_matrix: ${{ steps.route.outputs.ad_matrix }}
      pt_flash_backend: ${{ steps.route.outputs.pt_flash_backend }}
      pt_stability: ${{ steps.route.outputs.pt_stability }}
      pt_split: ${{ steps.route.outputs.pt_split }}
      pr76_pt_continuation: ${{ steps.route.outputs.pr76_pt_continuation }}
      pr76_max3: ${{ steps.route.outputs.pr76_max3 }}
      cpa_stability: ${{ steps.route.outputs.cpa_stability }}
      cpa_split: ${{ steps.route.outputs.cpa_split }}
      cpa_max3: ${{ steps.route.outputs.cpa_max3 }}
      cpa_baseline: ${{ steps.route.outputs.cpa_baseline }}
      cpa_pt_phase: ${{ steps.route.outputs.cpa_pt_phase }}
      cpa_physical_validation: ${{ steps.route.outputs.cpa_physical_validation }}
      thermo_has_work: ${{ steps.route.outputs.thermo_has_work }}
      thermo_matrix: ${{ steps.route.outputs.thermo_matrix }}
      physics_closure: ${{ steps.route.outputs.physics_closure }}
      model_configuration: ${{ steps.route.outputs.model_configuration }}
      sw92_thermodynamics: ${{ steps.route.outputs.sw92_thermodynamics }}
      sw92_family_vle: ${{ steps.route.outputs.sw92_family_vle }}
      sw92_profile_c_pt: ${{ steps.route.outputs.sw92_profile_c_pt }}
      sw92_profile_c_phase_set: ${{ steps.route.outputs.sw92_profile_c_phase_set }}
      sw92_profile_c_sensitivity: ${{ steps.route.outputs.sw92_profile_c_sensitivity }}
      sw92_physics_closure: ${{ steps.route.outputs.sw92_physics_closure }}
      sw92_phase_assigned_joint: ${{ steps.route.outputs.sw92_phase_assigned_joint }}
      sw92_phase_assigned_h_side_witness: ${{ steps.route.outputs.sw92_phase_assigned_h_side_witness }}
      sw92_phase_assigned_no_w: ${{ steps.route.outputs.sw92_phase_assigned_no_w }}
      sw92_phase_assigned_three_phase: ${{ steps.route.outputs.sw92_phase_assigned_three_phase }}
      sw92_phase_assigned_three_phase_closure: ${{ steps.route.outputs.sw92_phase_assigned_three_phase_closure }}
      sw92_phase_assigned_boundary: ${{ steps.route.outputs.sw92_phase_assigned_boundary }}
      trusted: ${{ steps.route.outputs.trusted }}
      legacy_cpa_clapeyron_oracle: ${{ steps.route.outputs.legacy_cpa_clapeyron_oracle }}
      legacy_cpa_performance_audit: ${{ steps.route.outputs.legacy_cpa_performance_audit }}
      legacy_cpa_thermopack_oracle: ${{ steps.route.outputs.legacy_cpa_thermopack_oracle }}
      legacy_discretization_core: ${{ steps.route.outputs.legacy_discretization_core }}
      legacy_frontend: ${{ steps.route.outputs.legacy_frontend }}
      legacy_hosted_web_model_product: ${{ steps.route.outputs.legacy_hosted_web_model_product }}
      legacy_mesh_baseline_benchmark: ${{ steps.route.outputs.legacy_mesh_baseline_benchmark }}
      legacy_mesh_core: ${{ steps.route.outputs.legacy_mesh_core }}
      legacy_mesh_external_compatibility: ${{ steps.route.outputs.legacy_mesh_external_compatibility }}
      legacy_mesh_petsc: ${{ steps.route.outputs.legacy_mesh_petsc }}
      legacy_model_configuration_grpc: ${{ steps.route.outputs.legacy_model_configuration_grpc }}
      legacy_physics_component_inventory: ${{ steps.route.outputs.legacy_physics_component_inventory }}
      legacy_pt_android_jni_emulator: ${{ steps.route.outputs.legacy_pt_android_jni_emulator }}
      legacy_pt_android_ndk_portability: ${{ steps.route.outputs.legacy_pt_android_ndk_portability }}
      legacy_pt_android_product_shell: ${{ steps.route.outputs.legacy_pt_android_product_shell }}
      legacy_pt_process_adapter: ${{ steps.route.outputs.legacy_pt_process_adapter }}
      legacy_pt_product_staging: ${{ steps.route.outputs.legacy_pt_product_staging }}
      legacy_pt_service: ${{ steps.route.outputs.legacy_pt_service }}
      legacy_pt_signed_installer_gate: ${{ steps.route.outputs.legacy_pt_signed_installer_gate }}
      legacy_pt_split: ${{ steps.route.outputs.legacy_pt_split }}
      legacy_pt_windows_desktop_installer: ${{ steps.route.outputs.legacy_pt_windows_desktop_installer }}
      legacy_stability: ${{ steps.route.outputs.legacy_stability }}
      legacy_sw92_asymmetric_fixed_pair: ${{ steps.route.outputs.legacy_sw92_asymmetric_fixed_pair }}
      legacy_sw92_asymmetric_max2: ${{ steps.route.outputs.legacy_sw92_asymmetric_max2 }}
      legacy_sw92_asymmetric_max2_physical_ternary: ${{ steps.route.outputs.legacy_sw92_asymmetric_max2_physical_ternary }}
      legacy_sw92_asymmetric_max2_validation: ${{ steps.route.outputs.legacy_sw92_asymmetric_max2_validation }}
      legacy_sw92_asymmetric_orchestration: ${{ steps.route.outputs.legacy_sw92_asymmetric_orchestration }}
      legacy_sw92_asymmetric_stability: ${{ steps.route.outputs.legacy_sw92_asymmetric_stability }}
      legacy_sw92_dual_model: ${{ steps.route.outputs.legacy_sw92_dual_model }}
      legacy_sw92_three_phase_experimental_line: ${{ steps.route.outputs.legacy_sw92_three_phase_experimental_line }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Install pinned metadata validator
      run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
    - name: Verify workflow mapping and selection contracts
      run: python3 .github/ci/verify_workflows.py
    - name: Select affected gates from verified checkpoint
      id: route
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/ci/plan.py
    permissions:
      contents: read
      actions: read
  flow-core:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.flow_core == 'true')
    uses: ./.github/workflows/flow_core.yml
  flow-discretization:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.flow_discretization == 'true')
    uses: ./.github/workflows/flow_discretization.yml
  flow-discretization-petsc:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.flow_discretization_petsc == 'true')
    uses: ./.github/workflows/flow_discretization_petsc.yml
  pt-flash-backend:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.pt_flash_backend == 'true')
    uses: ./.github/workflows/pt_flash_backend.yml
  pt-stability:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.pt_stability == 'true')
    uses: ./.github/workflows/stability.yml
    with:
      routed: true
  pt-split:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.pt_split == 'true')
    uses: ./.github/workflows/pt_split.yml
    with:
      routed: true
  pr76-pt-continuation:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.pr76_pt_continuation == 'true')
    uses: ./.github/workflows/pr76_pt_continuation.yml
  pr76-max3:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.pr76_max3 == 'true')
    uses: ./.github/workflows/pr76_three_phase.yml
  cpa-stability:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.cpa_stability == 'true')
    uses: ./.github/workflows/cpa_stability.yml
  cpa-split:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.cpa_split == 'true')
    uses: ./.github/workflows/cpa_split.yml
  cpa-max3:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.cpa_max3 == 'true')
    uses: ./.github/workflows/cpa_max3.yml
  cpa-baseline:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.cpa_baseline == 'true')
    uses: ./.github/workflows/cpa_baseline.yml
  cpa-pt-phase:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.cpa_pt_phase == 'true')
    uses: ./.github/workflows/cpa_pt_phase.yml
  cpa-physical-validation:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.cpa_physical_validation == 'true')
    uses: ./.github/workflows/cpa_physical_validation.yml
  thermodynamics:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.thermo_has_work == 'true')
    uses: ./.github/workflows/thermodynamics.yml
    with:
      matrix_json: ${{ needs.impact.outputs.thermo_matrix }}
  physics-closure:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.physics_closure == 'true')
    uses: ./.github/workflows/physics_closure.yml
  model-configuration:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.model_configuration == 'true')
    uses: ./.github/workflows/model_configuration.yml
  sw92-thermodynamics:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_thermodynamics == 'true')
    uses: ./.github/workflows/sw92.yml
  sw92-family-vle:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_family_vle == 'true')
    uses: ./.github/workflows/sw92_family_vle.yml
  sw92-profile-c-pt:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_profile_c_pt == 'true')
    uses: ./.github/workflows/sw92_phase_assigned_pt.yml
  sw92-profile-c-phase-set:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_profile_c_phase_set == 'true')
    uses: ./.github/workflows/sw92_profile_c_phase_set.yml
  sw92-profile-c-sensitivity:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_profile_c_sensitivity == 'true')
    uses: ./.github/workflows/sw92_profile_c_sensitivity.yml
  sw92-physics-closure:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_physics_closure == 'true')
    uses: ./.github/workflows/physics_sw92_closure.yml
  sw92-phase-assigned-joint:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_phase_assigned_joint == 'true')
    uses: ./.github/workflows/sw92_phase_assigned_joint.yml
  sw92-phase-assigned-h-side-witness:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_phase_assigned_h_side_witness == 'true')
    uses: ./.github/workflows/sw92_phase_assigned_h_side_witness.yml
  sw92-phase-assigned-no-w:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_phase_assigned_no_w == 'true')
    uses: ./.github/workflows/sw92_phase_assigned_no_w.yml
  sw92-phase-assigned-three-phase-topology:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.sw92_phase_assigned_three_phase == 'true' || needs.impact.outputs.sw92_phase_assigned_three_phase_closure
      == 'true' || needs.impact.outputs.sw92_phase_assigned_boundary == 'true')
    uses: ./.github/workflows/_sw92_phase_assigned_topology.yml
    with:
      run_three_phase: ${{ needs.impact.outputs.sw92_phase_assigned_three_phase == 'true' }}
      run_three_phase_closure: ${{ needs.impact.outputs.sw92_phase_assigned_three_phase_closure == 'true' }}
      run_boundary: ${{ needs.impact.outputs.sw92_phase_assigned_boundary == 'true' }}
  ad:
    needs: impact
    if: needs.impact.outputs.trusted == 'true' && (needs.impact.outputs.ad_has_work == 'true')
    uses: ./.github/workflows/ad.yml
    with:
      matrix_json: ${{ needs.impact.outputs.ad_matrix }}
  legacy_cpa_clapeyron_oracle__pinned-clapeyron-oracle:
    needs:
    - impact
    name: CPA Clapeyron external oracle / Pinned Clapeyron sCPA oracle
    runs-on:
    - self-hosted
    - linux
    - x64
    - mpmc_hnu
    timeout-minutes: 60
    steps:
    - name: Checkout MPMC_HNU
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Julia
      uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
      with:
        version: 1.10.12
    - name: Checkout pinned Clapeyron
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ClapeyronThermo/Clapeyron.jl
        ref: 229b09452f36c2f812486150df0bb43b197bb4e5
        path: _external/Clapeyron.jl
        persist-credentials: false
        fetch-depth: 1
    - name: Verify pinned source
      shell: bash
      run: 'set -euo pipefail

        actual="$(git -C _external/Clapeyron.jl rev-parse HEAD)"

        expected="229b09452f36c2f812486150df0bb43b197bb4e5"

        test "${actual}" = "${expected}"

        test -z "$(git -C _external/Clapeyron.jl status --porcelain)"

        echo "CLAPEYRON_PIN_OK commit=${actual}"

        '
    - name: Instantiate pinned Clapeyron
      env:
        JULIA_PKG_PRECOMPILE_AUTO: '0'
      shell: bash
      run: "set -euo pipefail\njulia --project=_external/Clapeyron.jl \\\n  -e 'using Pkg; Pkg.instantiate()'\n"
    - name: Audit formulation and generate ten-state oracle
      env:
        CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
      shell: bash
      run: "set -euo pipefail\nmkdir -p build/cpa-clapeyron-oracle\njulia --project=_external/Clapeyron.jl \\\n  tests/flash/cpa_clapeyron_oracle/generate_oracle.jl\
        \ \\\n  --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json \\\n  --out build/cpa-clapeyron-oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json\n\
        test -z \"$(git -C _external/Clapeyron.jl status --porcelain)\"\ncat build/cpa-clapeyron-oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json\n"
    - name: Verify frozen oracle reproduction
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\n\ngenerated = json.loads(Path(\n    \"build/cpa-clapeyron-oracle/\"\n    \"\
        clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json\"\n).read_text(encoding=\"utf-8\"))\nfrozen = json.loads(Path(\n    \"tests/flash/cpa_clapeyron_oracle/\"\
        \n    \"clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json\"\n).read_text(encoding=\"utf-8\"))\nif generated != frozen:\n    raise SystemExit(\"generated\
        \ Clapeyron oracle differs from frozen reference\")\nprint(\"CLAPEYRON_ORACLE_FREEZE_MATCH_OK states=\", len(generated[\"states\"]))\nPY\n"
    - name: Audit pinned Clapeyron derivative floor
      env:
        CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
      shell: bash
      run: "set -euo pipefail\njulia --project=_external/Clapeyron.jl \\\n  tests/flash/cpa_clapeyron_oracle/derivative_floor_audit.jl \\\n  --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json\
        \ \\\n  --oracle tests/flash/cpa_clapeyron_oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json \\\n  --out build/cpa-clapeyron-oracle/clapeyron_derivative_floor_audit.json\n\
        test -z \"$(git -C _external/Clapeyron.jl status --porcelain)\"\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\n\naudit = json.loads(Path(\n   \
        \ \"build/cpa-clapeyron-oracle/\"\n    \"clapeyron_derivative_floor_audit.json\"\n).read_text(encoding=\"utf-8\"))\nprint(\"CLAPEYRON_DERIVATIVE_FLOOR_ARTIFACT\"\
        ,\n      \"states=\", len(audit[\"states\"]),\n      \"steps=\", len(audit[\"frozen_relative_volume_steps\"]))\nPY\n"
    - name: Audit pinned Clapeyron BigFloat derivative floor
      env:
        CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
      shell: bash
      run: "set -euo pipefail\njulia --project=_external/Clapeyron.jl \\\n  tests/flash/cpa_clapeyron_oracle/bigfloat_derivative_audit.jl \\\n  --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json\
        \ \\\n  --oracle tests/flash/cpa_clapeyron_oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json \\\n  --out build/cpa-clapeyron-oracle/clapeyron_bigfloat_derivative_audit.json\n\
        test -z \"$(git -C _external/Clapeyron.jl status --porcelain)\"\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\n\naudit = json.loads(Path(\n   \
        \ \"build/cpa-clapeyron-oracle/\"\n    \"clapeyron_bigfloat_derivative_audit.json\"\n).read_text(encoding=\"utf-8\"))\nprint(\"CLAPEYRON_BIGFLOAT_DERIVATIVE_ARTIFACT\"\
        ,\n      \"records=\", len(audit[\"records\"]),\n      \"precisions=\", audit[\"precision_bits\"],\n      \"states=\", audit[\"problem_states\"])\nPY\n"
    - name: Audit state-4 association stationarity floor
      env:
        CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
      shell: bash
      run: "set -euo pipefail\njulia --project=_external/Clapeyron.jl \\\n  tests/flash/cpa_clapeyron_oracle/association_stationarity_floor_audit.jl \\\n  --states\
        \ tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json \\\n  --oracle tests/flash/cpa_clapeyron_oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json\
        \ \\\n  --out build/cpa-clapeyron-oracle/clapeyron_association_stationarity_floor_audit.json\ntest -z \"$(git -C _external/Clapeyron.jl status --porcelain)\"\
        \npython3 - <<'PY'\nimport json\nfrom pathlib import Path\n\naudit = json.loads(Path(\n    \"build/cpa-clapeyron-oracle/\"\n    \"clapeyron_association_stationarity_floor_audit.json\"\
        \n).read_text(encoding=\"utf-8\"))\nprint(\"CLAPEYRON_ASSOC_STATIONARITY_ARTIFACT\",\n      \"records=\", len(audit[\"records\"]),\n      \"precisions=\"\
        , audit[\"precision_bits\"],\n      \"state=\", audit[\"state\"][\"label\"])\nPY\n"
    - name: Audit pinned compressed exact2 independently
      env:
        CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
      shell: bash
      run: "set -euo pipefail\njulia --project=_external/Clapeyron.jl \\\n  tests/flash/cpa_clapeyron_oracle/independent_exact2_audit.jl \\\n  --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json\
        \ \\\n  --oracle tests/flash/cpa_clapeyron_oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json \\\n  --out build/cpa-clapeyron-oracle/clapeyron_independent_exact2_audit.json\n\
        test -z \"$(git -C _external/Clapeyron.jl status --porcelain)\"\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\n\naudit = json.loads(Path(\n   \
        \ \"build/cpa-clapeyron-oracle/\"\n    \"clapeyron_independent_exact2_audit.json\"\n).read_text(encoding=\"utf-8\"))\nprint(\"CLAPEYRON_INDEPENDENT_EXACT2_ARTIFACT\"\
        ,\n      \"records=\", len(audit[\"records\"]),\n      \"precisions=\", audit[\"precision_bits\"],\n      \"state=\", audit[\"state\"][\"label\"])\nPY\n"
    - name: Audit ten-state independent compressed association
      env:
        CLAPEYRON_COMMIT: 229b09452f36c2f812486150df0bb43b197bb4e5
      shell: bash
      run: "set -euo pipefail\njulia --project=_external/Clapeyron.jl \\\n  tests/flash/cpa_clapeyron_oracle/ten_state_independent_compressed_diagnostic.jl \\\n \
        \ --states tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_phase_kernel_33315k.json \\\n  --oracle tests/flash/cpa_clapeyron_oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json\
        \ \\\n  --out build/cpa-clapeyron-oracle/clapeyron_ten_state_independent_compressed_diagnostic.json\ntest -z \"$(git -C _external/Clapeyron.jl status --porcelain)\"\
        \npython3 - <<'PY'\nimport json\nfrom pathlib import Path\n\naudit = json.loads(Path(\n    \"build/cpa-clapeyron-oracle/\"\n    \"clapeyron_ten_state_independent_compressed_diagnostic.json\"\
        \n).read_text(encoding=\"utf-8\"))\nprint(\"CLAPEYRON_TEN_STATE_COMPRESSED_ARTIFACT\",\n      \"precisions=\", audit[\"precision_bits\"],\n      \"summaries=\"\
        , len(audit[\"summaries\"]))\nPY\n"
    - name: Upload generated oracle
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cpa-clapeyron-oracle
        path: build/cpa-clapeyron-oracle/clapeyron_229b094_meoh_h2o_phase_kernel_33315k.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload derivative-floor audit
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cpa-clapeyron-derivative-floor-audit
        path: build/cpa-clapeyron-oracle/clapeyron_derivative_floor_audit.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload BigFloat derivative audit
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cpa-clapeyron-bigfloat-derivative-audit
        path: build/cpa-clapeyron-oracle/clapeyron_bigfloat_derivative_audit.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload association stationarity audit
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cpa-clapeyron-association-stationarity-audit
        path: build/cpa-clapeyron-oracle/clapeyron_association_stationarity_floor_audit.json
        if-no-files-found: error
        retention-days: 7
