name: CI entry migration validation
on:
  push:
    branches: [work/ci-single-entry-20260921]
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned metadata validators
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Verify candidate and export content blobs for authorized connector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, yaml
          previous = subprocess.check_output(['git', 'show', '78d3d3ff807f24475ca43cb23ef750827c782f16:.github/workflows/pr_incremental_ci.yml'], text=True)
          command = yaml.safe_load(previous)['jobs']['audit']['steps'][-1]['run']
          patch = '''python3 - <<'PATCH'
          from pathlib import Path
          p = Path('/tmp/entry_migration.py')
          s = p.read_text()
          s = s.split("tree = api('/git/trees'")[0]
          s += "mapping = {}\\nfor entry in entries:\\n    blob = api('/git/blobs', {'content': entry['content'], 'encoding': 'utf-8'})\\n    mapping[entry['path']] = blob['sha']\\nprint('VALIDATED_BLOB_MAP=' + json.dumps(mapping), flush=True)\\n"
          p.write_text(s)
          PATCH
          python3 /tmp/entry_migration.py
          '''
          command = command.replace('python3 /tmp/entry_migration.py\n', patch)
          subprocess.run(['bash', '-e', '-c', command], check=True)
          PY
