name: Hosted runner map regeneration
on:
  push:
    branches: [work/ci-single-entry-20260921]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/hosted-linux-runner-migration-20260921
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned metadata validator
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Recompute audited workflow map and validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          import yaml

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = "work/hosted-linux-runner-migration-20260921"

          def load(path):
              obj = yaml.safe_load(Path(path).read_text(encoding="utf-8"))
              if isinstance(obj, dict) and True in obj:
                  obj["on"] = obj.pop(True)
              return obj

          def digest(obj):
              return hashlib.sha256(
                  json.dumps(obj, sort_keys=True, ensure_ascii=False).encode()
              ).hexdigest()

          map_path = Path(".github/ci/workflow_map.json")
          catalog = json.loads(map_path.read_text(encoding="utf-8"))
          router_path = ".github/workflows/pr_incremental_ci.yml"

          for path, spec in catalog["workflows"].items():
              wf = load(path)
              if path != router_path:
                  spec.pop("retained_blob_sha", None)
                  spec["retained_hash"] = digest(wf)
              for job_name, job_spec in spec.get("jobs", {}).items():
                  actual = (wf.get("jobs") or {}).get(job_name)
                  if actual is None:
                      continue
                  job_spec["runner"] = actual.get("runs-on")
                  job_spec["strategy"] = actual.get("strategy")

          content = json.dumps(catalog, ensure_ascii=False, indent=2) + "\n"
          map_path.write_text(content, encoding="utf-8")

          for path in Path(".github/workflows").glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              if "mpmc_hnu" in text or "self-hosted" in text:
                  raise SystemExit("private runner reference remains: " + str(path))

          subprocess.run([
              "python3", "-m", "py_compile",
              ".github/ci/impact_rules.py",
              ".github/ci/plan.py",
              ".github/ci/verify_result.py",
              ".github/ci/verify_workflows.py",
          ], check=True)
          subprocess.run(["python3", ".github/ci/verify_workflows.py"], check=True)
          subprocess.run(["git", "diff", "--check"], check=True)

          # Update only the non-workflow audit map on the temporary branch.
          api_url = "https://api.github.com/repos/" + repo + "/contents/.github/ci/workflow_map.json?ref=" + branch
          req = urllib.request.Request(
              api_url,
              headers={"Authorization":"Bearer " + token, "Accept":"application/vnd.github+json"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              current = json.load(response)
          payload = {
              "message": "chore(ci): refresh hosted runner workflow map",
              "content": base64.b64encode(content.encode()).decode(),
              "sha": current["sha"],
              "branch": branch,
          }
          req = urllib.request.Request(
              "https://api.github.com/repos/" + repo + "/contents/.github/ci/workflow_map.json",
              data=json.dumps(payload).encode(),
              method="PUT",
              headers={
                  "Authorization":"Bearer " + token,
                  "Accept":"application/vnd.github+json",
                  "Content-Type":"application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          print("UPDATED_MAP_COMMIT=" + result["commit"]["sha"])
          print("HOSTED_RUNNER_MAP_VALIDATED")
          PY
