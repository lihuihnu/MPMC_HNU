name: Final CI governance validation
on:
  push:
    branches: [work/ci-single-entry-20260921]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/ci-final-governance-fixes-20260922
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned metadata parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Regenerate workflow map and run governance regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          import yaml

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = "work/ci-final-governance-fixes-20260922"
          router_path = ".github/workflows/pr_incremental_ci.yml"

          def load(path):
              obj = yaml.safe_load(Path(path).read_text(encoding="utf-8"))
              if isinstance(obj, dict) and True in obj:
                  obj["on"] = obj.pop(True)
              return obj

          def digest(obj):
              return hashlib.sha256(
                  json.dumps(obj, sort_keys=True, ensure_ascii=False).encode()
              ).hexdigest()

          map_path = Path(".github/ci/workflow_map.json")
          catalog = json.loads(map_path.read_text(encoding="utf-8"))
          for path, spec in catalog["workflows"].items():
              wf = load(path)
              if path != router_path:
                  spec.pop("retained_blob_sha", None)
                  spec["retained_hash"] = digest(wf)
              for job_name, job_spec in spec.get("jobs", {}).items():
                  actual = (wf.get("jobs") or {}).get(job_name)
                  if actual is None:
                      continue
                  job_spec["runner"] = actual.get("runs-on")
                  job_spec["strategy"] = actual.get("strategy")
          content = json.dumps(catalog, ensure_ascii=False, indent=2) + "\n"
          map_path.write_text(content, encoding="utf-8")

          # Structural checks for the two routed reusable workflows.
          ad = load(".github/workflows/ad.yml")
          stability = load(".github/workflows/stability.yml")
          assert ad["on"]["workflow_call"]["outputs"]["validated"]["value"] == "${{ jobs.validation-result.outputs.validated }}"
          assert stability["on"]["workflow_call"]["outputs"]["validated"]["value"] == "${{ jobs.validation-result.outputs.validated }}"
          assert "github.run_id" in ad["concurrency"]["group"]
          assert "github.run_id" in stability["concurrency"]["group"]
          assert "validation-result" in ad["jobs"]
          assert "validation-result" in stability["jobs"]

          # Private runner is only the long CPA performance gate, both standalone and central owner.
          private = []
          for path in sorted(catalog["workflows"]):
              wf = load(path)
              for job_name, job in (wf.get("jobs") or {}).items():
                  serialized = json.dumps(job, sort_keys=True)
                  if "mpmc_hnu" in serialized or "self-hosted" in serialized:
                      private.append((path, job_name))
          expected_private = sorted([
              (".github/workflows/cpa_performance_audit.yml", "paired-baseline"),
              (router_path, "legacy_cpa_performance_audit__paired-baseline"),
          ])
          assert sorted(private) == expected_private, (private, expected_private)

          subprocess.run([
              "python3", "-m", "py_compile",
              ".github/ci/impact_rules.py",
              ".github/ci/plan.py",
              ".github/ci/verify_result.py",
              ".github/ci/verify_workflows.py",
              "products/pt_android/tests/test_android_boundary.py",
          ], check=True)
          subprocess.run([
              "python3", "-m", "unittest", "discover",
              "-s", "products/pt_android/tests", "-p", "test_*.py", "-v",
          ], check=True)
          subprocess.run(["python3", ".github/ci/verify_workflows.py"], check=True)
          subprocess.run(["git", "diff", "--check", "070efd87bd30e6bfc4899bc4d7e81fd14469ea06..HEAD"], check=True)

          # Push only the regenerated non-workflow audit map to the temporary branch.
          api_url = "https://api.github.com/repos/" + repo + "/contents/.github/ci/workflow_map.json?ref=" + branch
          req = urllib.request.Request(
              api_url,
              headers={"Authorization":"Bearer " + token, "Accept":"application/vnd.github+json"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              current = json.load(response)
          payload = {
              "message": "chore(ci): refresh final workflow map",
              "content": base64.b64encode(content.encode()).decode(),
              "sha": current["sha"],
              "branch": branch,
          }
          req = urllib.request.Request(
              "https://api.github.com/repos/" + repo + "/contents/.github/ci/workflow_map.json",
              data=json.dumps(payload).encode(),
              method="PUT",
              headers={
                  "Authorization":"Bearer " + token,
                  "Accept":"application/vnd.github+json",
                  "Content-Type":"application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          print("UPDATED_MAP_COMMIT=" + result["commit"]["sha"])
          print("FINAL_CI_GOVERNANCE_VALIDATION_OK")
          PY
