        \ build/pt-android-product-shell-native-arm64-v8a/libmpmc_pt_android_core.so)\"\ntest -f \"$x86_core\"\ntest -f \"$arm64_core\"\n\ntoolchain=\"$MPMC_ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin\"\
        \n\"$toolchain/llvm-readelf\" -h \"$x86_core\" | grep -F 'Advanced Micro Devices X86-64'\n\"$toolchain/llvm-readelf\" -h \"$arm64_core\" | grep -F 'AArch64'\n\
        for core in \"$x86_core\" \"$arm64_core\"; do\n  \"$toolchain/llvm-nm\" -D --defined-only \"$core\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_discoverJson'\n\
        \  \"$toolchain/llvm-nm\" -D --defined-only \"$core\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_solveJson'\n  \"$toolchain/llvm-nm\" -D --defined-only\
        \ \"$core\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_modelApplyRecords'\n  \"$toolchain/llvm-nm\" -D --defined-only \"$core\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_modelSolveRecords'\n\
        \  \"$toolchain/llvm-nm\" -D --defined-only \"$core\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_modelReleaseRecords'\n  \"$toolchain/llvm-nm\" -D --defined-only\
        \ \"$core\" | grep -F 'Java_org_mpmc_ptandroid_NativeBridge_modelCancel'\ndone\n\necho \"MPMC_ANDROID_CORE_X86_64=$x86_core\" >> \"$GITHUB_ENV\"\necho \"\
        MPMC_ANDROID_CORE_ARM64_V8A=$arm64_core\" >> \"$GITHUB_ENV\"\n"
    - name: Generate Capacitor Android project and build universal debug APK
      shell: bash
      run: bash products/pt_android/shell/build_product_shell.sh --core-library-x86_64 "$MPMC_ANDROID_CORE_X86_64" --core-library-arm64-v8a "$MPMC_ANDROID_CORE_ARM64_V8A"
        --out build/pt-android-product-shell
    - name: Boot x86_64 emulator and exercise universal React to JNI PT path
      shell: bash
      run: bash products/pt_android/shell/run_product_shell_emulator.sh --apk build/pt-android-product-shell/mpmc-pt-android-product-shell-v1-universal-debug.apk
        --out build/pt-android-product-shell-evidence
    - name: Upload Android Product Shell evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mpmc-pt-android-product-shell-v1-universal-debug
        path: 'build/pt-android-product-shell/mpmc-pt-android-product-shell-v1-universal-debug.apk

          build/pt-android-product-shell-evidence/emulator.txt

          build/pt-android-product-shell-evidence/logcat.txt

          build/pt-android-product-shell-evidence/dom.json

          '
        if-no-files-found: warn
        retention-days: 7
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.impact.outputs.trusted == 'true' && needs.impact.outputs.legacy_pt_android_product_shell
      == 'true' && ('true' == 'true')
    permissions:
      contents: read
    concurrency:
      group: pt-android-product-shell-${{ github.ref }}-legacy_pt_android_product_shell__product-shell
      cancel-in-progress: true
  legacy_pt_process_adapter__adapter:
    needs:
    - impact
    name: PT gRPC process adapter / ${{ matrix.name }}
    runs-on:
    - self-hosted
    - linux
    - x64
    - mpmc_hnu
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: GCC Debug + ASan/UBSan + TS golden
          compiler: g++
          config: Debug
          sanitizers: 'ON'
          cross_language: true
        - name: Clang Release
          compiler: clang++
          config: Release
          sanitizers: 'OFF'
          cross_language: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pinned Ubuntu 24.04 Protobuf and gRPC packages
      run: "sudo apt-get update\nsudo apt-get install --yes --no-install-recommends \\\n  libgrpc++-dev=1.51.1-4.1build5 \\\n  protobuf-compiler-grpc=1.51.1-4.1build5\
        \ \\\n  libprotobuf-dev=3.21.12-8.2ubuntu0.3 \\\n  protobuf-compiler=3.21.12-8.2ubuntu0.3\nprotoc --version\ngrpc_cpp_plugin --version || true\n"
    - name: Configure PT process adapter
      run: "cmake -S tests/runtime/pt_grpc_adapter \\\n  -B build/pt-grpc-adapter \\\n  -DCMAKE_BUILD_TYPE=${{ matrix.config }} \\\n  -DCMAKE_CXX_COMPILER=${{ matrix.compiler\
        \ }} \\\n  -DMPMC_PT_GRPC_ENABLE_SANITIZERS=${{ matrix.sanitizers }}\n"
    - name: Generate isolated mTLS test authorities and identities
      run: "set -euo pipefail\ncert_dir=\"${PWD}/build/pt-process-certs\"\nmkdir -p \"${cert_dir}\"\n\nissue_ca() {\n  local name=$1\n  openssl req -x509 -newkey\
        \ rsa:2048 -nodes -sha256 -days 1 \\\n    -subj \"/CN=${name}\" \\\n    -keyout \"${cert_dir}/${name}.key\" \\\n    -out \"${cert_dir}/${name}.crt\"\n}\n\
        issue_identity() {\n  local name=$1\n  local common_name=$2\n  local authority=$3\n  local extension=$4\n  openssl req -newkey rsa:2048 -nodes -sha256 \\\n\
        \    -subj \"/CN=${common_name}\" -addext \"${extension}\" \\\n    -keyout \"${cert_dir}/${name}.key\" \\\n    -out \"${cert_dir}/${name}.csr\"\n  openssl\
        \ x509 -req -sha256 -days 1 -copy_extensions copy \\\n    -in \"${cert_dir}/${name}.csr\" \\\n    -CA \"${cert_dir}/${authority}.crt\" \\\n    -CAkey \"${cert_dir}/${authority}.key\"\
        \ \\\n    -CAcreateserial -out \"${cert_dir}/${name}.crt\"\n}\n\nissue_ca backend-ca\nissue_ca edge-ca\nissue_ca public-ca\nissue_ca browser-ca\nissue_identity\
        \ backend pt-backend.internal backend-ca \\\n  \"subjectAltName=DNS:pt-backend.internal\"\nissue_identity edge envoy-edge edge-ca \\\n  \"extendedKeyUsage=clientAuth\"\
        \nissue_identity public api.example.test public-ca \\\n  \"subjectAltName=DNS:api.example.test\"\nissue_identity browser browser-test-client browser-ca \\\
        \n  \"extendedKeyUsage=clientAuth\"\n# These one-day identities are job-local test material; the Envoy\n# container runs under a different UID and needs read-only\
        \ access.\nchmod 0644 \"${cert_dir}\"/*.crt \"${cert_dir}\"/*.key\n"
    - name: Configure secure PT composition/process host
      run: "cmake -S tests/runtime/pt_process_host \\\n  -B build/pt-process-host \\\n  -DCMAKE_BUILD_TYPE=${{ matrix.config }} \\\n  -DCMAKE_CXX_COMPILER=${{ matrix.compiler\
        \ }} \\\n  -DMPMC_PT_PROCESS_ENABLE_SANITIZERS=${{ matrix.sanitizers }} \\\n  -DMPMC_PT_PROCESS_TEST_CERT_DIR=\"${PWD}/build/pt-process-certs\"\n"
    - name: Build PT process adapter
      run: cmake --build build/pt-grpc-adapter --target mpmc_pt_grpc_adapter_tests mpmc_pt_grpc_golden_server --parallel 2
    - name: Build secure PT composition/process host
      run: cmake --build build/pt-process-host --target mpmc_pt_process_tests mpmc_pt_service_host mpmc_pt_secure_test_server mpmc_pt_secure_client --parallel 2
    - name: Run native adapter resource and lifecycle regression
      run: ctest --test-dir build/pt-grpc-adapter -R '^runtime[.]pt_grpc_adapter[.]' --verbose --no-tests=error
    - name: Run composition ownership, observability, and native mTLS regression
      run: ctest --test-dir build/pt-process-host -R '^runtime[.]pt_process[.]' --verbose --no-tests=error
    - name: Start repository-curated production entry and discover three backends
      run: "set -euo pipefail\ncert_dir=\"$PWD/build/pt-process-certs\"\nhost_log=\"$PWD/build/pt-process-host/production-host.log\"\nASAN_OPTIONS=detect_leaks=0\
        \ \\\n  ./build/pt-process-host/pt-process-library/mpmc_pt_service_host \\\n  --listen-address 127.0.0.1:50052 \\\n  --tls-certificate-chain \"$cert_dir/backend.crt\"\
        \ \\\n  --tls-private-key \"$cert_dir/backend.key\" \\\n  --trusted-edge-client-ca \"$cert_dir/edge-ca.crt\" \\\n  >\"$host_log\" 2>&1 &\nhost_pid=$!\ncleanup()\
        \ {\n  kill -TERM \"$host_pid\" 2>/dev/null || true\n}\ntrap cleanup EXIT\n\nfor attempt in {1..100}; do\n  if grep --quiet '\"event\":\"pt_process_ready\"\
        ' \"$host_log\"; then\n    break\n  fi\n  if ! kill -0 \"$host_pid\" 2>/dev/null; then\n    cat \"$host_log\"\n    exit 1\n  fi\n  sleep 0.1\ndone\ngrep --quiet\
        \ '\"configured_backends\":3' \"$host_log\"\n./build/pt-process-host/mpmc_pt_secure_client \\\n  127.0.0.1:50052 pt-backend.internal \\\n  \"$cert_dir/backend-ca.crt\"\
        \ \\\n  \"$cert_dir/edge.crt\" \\\n  \"$cert_dir/edge.key\" \\\n  3 pr76.methane-ethane-propane.literature-r1\nkill -TERM \"$host_pid\"\nwait \"$host_pid\"\
        \ntrap - EXIT\ngrep --quiet '\"event\":\"pt_process_stopped\"' \"$host_log\"\n"
    - name: Run production edge renderer regression
      run: python3 -m unittest discover -s deploy/pt-grpc-web/tests -v
    - name: Enforce model-neutral host and adapter boundary
      run: python3 -m unittest discover -s tests/runtime/pt_process_host -p 'test_*.py' -v
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      if: matrix.cross_language
      with:
        node-version: 24.21.0
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install exact TypeScript golden-test dependencies
      if: matrix.cross_language
      working-directory: frontend
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Validate Envoy gRPC-Web and CORS configuration
      if: matrix.cross_language
      run: docker run --rm --volume "${PWD}/deploy/pt-grpc-web/envoy.yaml:/etc/envoy/envoy.yaml:ro" envoyproxy/envoy:v1.36.9 --mode validate -c /etc/envoy/envoy.yaml
    - name: Render and validate production mTLS edge
      if: matrix.cross_language
      run: "set -euo pipefail\ncert_dir=\"${PWD}/build/pt-process-certs\"\npython3 deploy/pt-grpc-web/render_production_config.py \\\n  --public-host api.example.test\
        \ \\\n  --public-origin https://ui.example.test \\\n  --downstream-certificate-chain /run/secrets/public.crt \\\n  --downstream-private-key /run/secrets/public.key\
        \ \\\n  --downstream-client-ca /run/secrets/browser-ca.crt \\\n  --upstream-server-name pt-backend.internal \\\n  --upstream-client-certificate-chain /run/secrets/edge.crt\
        \ \\\n  --upstream-client-private-key /run/secrets/edge.key \\\n  --upstream-server-ca /run/secrets/backend-ca.crt \\\n  > build/pt-envoy-production.yaml\n\
        docker run --rm \\\n  --volume \"${PWD}/build/pt-envoy-production.yaml:/etc/envoy/envoy.yaml:ro\" \\\n  --volume \"${cert_dir}:/run/secrets:ro\" \\\n  envoyproxy/envoy:v1.36.9\
        \ \\\n  --mode validate -c /etc/envoy/envoy.yaml\n"
    - name: Run TypeScript to C++ gRPC-Web golden
      if: matrix.cross_language
      run: "set -euo pipefail\nserver_log=\"${PWD}/build/pt-grpc-adapter/golden-server.log\"\nASAN_OPTIONS=detect_leaks=0 \\\n  ./build/pt-grpc-adapter/mpmc_pt_grpc_golden_server\
        \ \\\n  127.0.0.1:50051 >\"${server_log}\" 2>&1 &\nserver_pid=$!\ncontainer_name=\"mpmc-pt-envoy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\ncleanup() {\n \
        \ kill \"${server_pid}\" 2>/dev/null || true\n  docker rm --force \"${container_name}\" >/dev/null 2>&1 || true\n}\ntrap cleanup EXIT\n\nfor attempt in {1..50};\
        \ do\n  if grep --quiet '^READY ' \"${server_log}\"; then break; fi\n  sleep 0.1\ndone\nif ! grep '^READY ' \"${server_log}\"; then\n  tail -200 \"${server_log}\"\
        \ || true\n  exit 1\nfi\n\ndocker run --detach --rm --network host \\\n  --name \"${container_name}\" \\\n  --volume \"${PWD}/deploy/pt-grpc-web/envoy.yaml:/etc/envoy/envoy.yaml:ro\"\
        \ \\\n  envoyproxy/envoy:v1.36.9 \\\n  -c /etc/envoy/envoy.yaml\nfor attempt in {1..100}; do\n  if curl --fail --silent http://127.0.0.1:9901/ready >/dev/null;\
        \ then\n    break\n  fi\n  sleep 0.1\ndone\nif ! curl --fail --silent http://127.0.0.1:9901/ready; then\n  docker logs \"${container_name}\" || true\n  exit\
        \ 1\nfi\n\nif ! (cd frontend && \\\n  MPMC_PT_GOLDEN_ENDPOINT=http://127.0.0.1:8080 \\\n  npm test -- src/api/ptProcessGolden.test.ts); then\n  docker logs\
        \ \"${container_name}\" || true\n  tail -200 \"${server_log}\" || true\n  exit 1\nfi\n"
    - name: Run production edge mutual-TLS, CORS, health, and metrics regression
      if: matrix.cross_language
      run: "set -euo pipefail\ncert_dir=\"${PWD}/build/pt-process-certs\"\nserver_log=\"${PWD}/build/pt-process-host/secure-server.log\"\nASAN_OPTIONS=detect_leaks=0\
        \ \\\n  ./build/pt-process-host/mpmc_pt_secure_test_server \\\n  127.0.0.1:50051 \\\n  \"${cert_dir}/backend.crt\" \\\n  \"${cert_dir}/backend.key\" \\\n\
        \  \"${cert_dir}/edge-ca.crt\" >\"${server_log}\" 2>&1 &\nserver_pid=$!\ncontainer_name=\"mpmc-pt-production-envoy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\
        \ncleanup() {\n  kill \"${server_pid}\" 2>/dev/null || true\n  docker rm --force \"${container_name}\" >/dev/null 2>&1 || true\n}\ntrap cleanup EXIT\n\nfor\
        \ attempt in {1..50}; do\n  if grep --quiet '^READY ' \"${server_log}\"; then break; fi\n  sleep 0.1\ndone\nif ! grep '^READY ' \"${server_log}\"; then\n\
        \  tail -200 \"${server_log}\" || true\n  exit 1\nfi\n\ndocker run --detach --rm --network host \\\n  --name \"${container_name}\" \\\n  --volume \"${PWD}/build/pt-envoy-production.yaml:/etc/envoy/envoy.yaml:ro\"\
        \ \\\n  --volume \"${cert_dir}:/run/secrets:ro\" \\\n  envoyproxy/envoy:v1.36.9 \\\n  -c /etc/envoy/envoy.yaml\nfor attempt in {1..100}; do\n  if curl --fail\
        \ --silent http://127.0.0.1:9901/ready >/dev/null; then\n    break\n  fi\n  sleep 0.1\ndone\ncurl --fail --silent http://127.0.0.1:9901/ready >/dev/null\n\
        \ncluster_state=\"${PWD}/build/pt-production-clusters.txt\"\nfor attempt in {1..100}; do\n  curl --fail --silent http://127.0.0.1:9901/clusters \\\n    -o\
        \ \"${cluster_state}\"\n  if grep --quiet \\\n    'pt_service_native_grpc::127.0.0.1:50051::health_flags::healthy' \\\n    \"${cluster_state}\"; then\n  \
        \  break\n  fi\n  sleep 0.1\ndone\ngrep --quiet \\\n  'pt_service_native_grpc::127.0.0.1:50051::health_flags::healthy' \\\n  \"${cluster_state}\"\n\nif curl\
        \ --silent --show-error --noproxy '*' \\\n  --cacert \"${cert_dir}/public-ca.crt\" \\\n  --resolve api.example.test:8443:127.0.0.1 \\\n  https://api.example.test:8443/\
        \ >/dev/null 2>&1; then\n  echo \"production edge accepted a client without a certificate\"\n  exit 1\nfi\n\n./build/pt-process-host/mpmc_pt_secure_client\
        \ \\\n  127.0.0.1:8443 api.example.test \\\n  \"${cert_dir}/public-ca.crt\" \\\n  \"${cert_dir}/browser.crt\" \\\n  \"${cert_dir}/browser.key\"\n\nallowed_headers=\"\
        ${PWD}/build/cors-allowed.headers\"\ncurl --fail --silent --show-error --noproxy '*' \\\n  --cacert \"${cert_dir}/public-ca.crt\" \\\n  --cert \"${cert_dir}/browser.crt\"\
        \ \\\n  --key \"${cert_dir}/browser.key\" \\\n  --resolve api.example.test:8443:127.0.0.1 \\\n  -H 'Origin: https://ui.example.test' \\\n  -H 'Access-Control-Request-Method:\
        \ POST' \\\n  -H 'Host: api.example.test' \\\n  -X OPTIONS -D \"${allowed_headers}\" -o /dev/null \\\n  https://api.example.test:8443/mpmc.runtime.v1.PtFlashService/DiscoverPtCapabilities\n\
        grep --ignore-case --quiet \\\n  '^access-control-allow-origin: https://ui.example.test' \\\n  \"${allowed_headers}\"\ngrep --ignore-case --quiet \\\n  '^access-control-allow-credentials:\
        \ true' \"${allowed_headers}\"\n\ndenied_headers=\"${PWD}/build/cors-denied.headers\"\ncurl --silent --show-error --noproxy '*' \\\n  --cacert \"${cert_dir}/public-ca.crt\"\
        \ \\\n  --cert \"${cert_dir}/browser.crt\" \\\n  --key \"${cert_dir}/browser.key\" \\\n  --resolve api.example.test:8443:127.0.0.1 \\\n  -H 'Origin: https://denied.example.test'\
        \ \\\n  -H 'Access-Control-Request-Method: POST' \\\n  -H 'Host: api.example.test' \\\n  -X OPTIONS -D \"${denied_headers}\" -o /dev/null \\\n  https://api.example.test:8443/mpmc.runtime.v1.PtFlashService/DiscoverPtCapabilities\n\
        if grep --ignore-case --quiet '^access-control-allow-origin:' \\\n  \"${denied_headers}\"; then\n  echo \"production edge emitted CORS approval for a denied\
        \ origin\"\n  exit 1\nfi\n\nmetrics_file=\"${PWD}/build/envoy-prometheus.txt\"\ncurl --fail --silent \\\n  http://127.0.0.1:9901/stats/prometheus -o \"${metrics_file}\"\
        \ngrep --quiet '^envoy_' \"${metrics_file}\"\nedge_log=\"${PWD}/build/pt-production-envoy.log\"\ndocker logs \"${container_name}\" >\"${edge_log}\" 2>&1\n\
        grep --quiet 'pt_edge_request' \"${edge_log}\"\n"
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.impact.outputs.trusted == 'true' && needs.impact.outputs.legacy_pt_process_adapter
      == 'true' && ('true' == 'true')
    permissions:
      contents: read
    concurrency:
      group: pt-process-adapter-${{ github.ref }}-legacy_pt_process_adapter__adapter
      cancel-in-progress: true
  legacy_pt_product_staging__seed:
    needs:
    - impact
    name: PT cross-platform product staging / Seed ${{ matrix.name }} dependencies
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux x64 Release
          os: ubuntu-24.04
          runner: mpmc_hnu
          profile: linux-x86_64-release
        - name: Windows x64 Release
          os: windows-2022
          runner: windows-2022
          profile: windows-x86_64-release
        - name: macOS arm64 Release
          os: macos-15
          runner: macos-15
          profile: macos-armv8-release
    env:
      CONAN_HOME: ${{ github.workspace }}/build/conan-home
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pinned Conan client
      run: python -m pip install --disable-pip-version-check conan==2.32.0
    - name: Restore exact Conan dependency cache
      id: conan-cache
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: ${{ env.CONAN_HOME }}
        key: pt-product-conan-v1-${{ matrix.profile }}-${{ hashFiles('products/pt/conanfile.txt', 'products/pt/conan.lock', 'products/pt/conan/profiles/*') }}
    - name: Download published binaries on cache miss
      if: steps.conan-cache.outputs.cache-hit != 'true'
      run: conan install products/pt --lockfile=products/pt/conan.lock --profile:all=products/pt/conan/profiles/${{ matrix.profile }} --build=never --output-folder=build/conan-seed
    - name: Verify seed from cache with source builds disabled
      run: conan install products/pt --lockfile=products/pt/conan.lock --profile:all=products/pt/conan/profiles/${{ matrix.profile }} --no-remote --build=never --output-folder=build/conan-seed-verify
    - name: Save only the completed Conan dependency cache
      if: steps.conan-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: ${{ env.CONAN_HOME }}
        key: ${{ steps.conan-cache.outputs.cache-primary-key }}
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.impact.outputs.trusted == 'true' && needs.impact.outputs.legacy_pt_product_staging
      == 'true' && ('true' == 'true')
    permissions:
      contents: read
    concurrency:
      group: pt-product-staging-${{ github.ref }}-legacy_pt_product_staging__seed
      cancel-in-progress: true
  legacy_pt_product_staging__stage:
    name: PT cross-platform product staging / ${{ matrix.name }}
    needs:
    - impact
    - legacy_pt_product_staging__seed
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux x64 Release
          os: ubuntu-24.04
          runner: mpmc_hnu
          profile: linux-x86_64-release
        - name: Windows x64 Release
          os: windows-2022
          runner: windows-2022
          profile: windows-x86_64-release
        - name: macOS arm64 Release
          os: macos-15
          runner: macos-15
          profile: macos-armv8-release
    env:
      CONAN_HOME: ${{ github.workspace }}/build/conan-home
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pinned Conan client
      run: python -m pip install --disable-pip-version-check conan==2.32.0
    - name: Restore seeded Conan dependency cache
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: ${{ env.CONAN_HOME }}
        key: pt-product-conan-v1-${{ matrix.profile }}-${{ hashFiles('products/pt/conanfile.txt', 'products/pt/conan.lock', 'products/pt/conan/profiles/*') }}
        fail-on-cache-miss: true
    - name: Resolve locked graph offline
      run: conan install products/pt --lockfile=products/pt/conan.lock --profile:all=products/pt/conan/profiles/${{ matrix.profile }} --no-remote --build=never --output-folder=build/conan-generators
        --format=json > build/conan-graph.json
    - name: Validate restore-only dependency evidence (RESTORE_ONLY_DEPENDENCIES_OK)
      run: python products/pt/scripts/prepare_conan_metadata.py --graph=build/conan-graph.json --lockfile=products/pt/conan.lock --output=build/conan-metadata --profile-id=${{
