                  if sha.match(candidate_before) and sha.match(candidate_after):
                      before = candidate_before
                      after = candidate_after
                  else:
                      fail_open = True
                      print("Synchronize SHAs unavailable; failing open.")

              if not fail_open and sha.match(before) and sha.match(after):
                  diff = subprocess.run(
                      ["git", "diff", "--name-only", "-z", before, after],
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                  )
                  if diff.returncode == 0:
                      changed = [
                          path
                          for path in diff.stdout.decode("utf-8").split("\0")
                          if path
                      ]
                      impact = route(changed)
                      selected_ad = ad_suites_for(changed)
                      selected_thermo = (
                          thermo_suites_for(changed)
                          if impact["thermodynamics_contracts"]
                          else []
                      )
                  else:
                      fail_open = True
                      print("PR diff failed; failing open.")
              else:
                  fail_open = True

              if fail_open:
                  impact = {gate: True for gate in ownership}
                  selected_ad = list(all_ad_suites)
                  selected_thermo = list(all_thermo_suites)

              print("Diff scope:", before, "->", after)
              print("Changed paths:", json.dumps(changed, ensure_ascii=False))

          matrix = ad_matrix(selected_ad)
          thermo = thermo_matrix(selected_thermo)
          print("Impact:", json.dumps(impact, sort_keys=True))
          print("Selected AD suites:", selected_ad)
          print("Selected thermodynamics suites:", selected_thermo)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for gate, affected in impact.items():
                  output.write(f"{gate}={'true' if affected else 'false'}\n")
              output.write(f"ad_has_work={'true' if selected_ad else 'false'}\n")
              output.write("ad_matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              output.write(f"thermo_has_work={'true' if selected_thermo else 'false'}\n")
              output.write("thermo_matrix=" + json.dumps(thermo, separators=(",", ":")) + "\n")

