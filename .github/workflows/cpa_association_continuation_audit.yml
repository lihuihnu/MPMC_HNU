name: CPA association continuity audit

# Deferred optimization evidence only. The active CPA development line has
# returned to thermodynamic-model correctness and the residual Helmholtz kernel.
# Keep this workflow for explicit reproduction without running it on every CPA
# model change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpa-association-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: shadow continuation / ubuntu-24.04 / Clang Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record environment
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)"
          clang++ --version | head -n 1
          cmake --version | head -n 1

      - name: Configure Release audit
        run: |
          cmake -S tests/flash/cpa_association_continuation_audit \
            -B build/cpa-association-continuation-audit \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DMPMC_SOURCE_ROOT="${GITHUB_WORKSPACE}"

      - name: Build Release audit
        run: cmake --build build/cpa-association-continuation-audit --parallel 2

      - name: Verify frozen continuation safety contract
        run: |
          set -euo pipefail
          build/cpa-association-continuation-audit/mpmc_cpa_association_continuation_contract \
            | tee build/cpa-association-continuation-audit/contract.log
          grep 'CPA_ASSOC_CONTINUATION_CONTRACT_OK' \
            build/cpa-association-continuation-audit/contract.log

      - name: Replay production density scans with shadow continuation
        run: |
          set -euo pipefail
          build/cpa-association-continuation-audit/mpmc_cpa_association_continuation_audit \
            | tee build/cpa-association-continuation-audit/audit.log
          summary="$(grep 'CPA_ASSOC_CONTINUATION_SUMMARY' build/cpa-association-continuation-audit/audit.log)"
          test -n "${summary}"
          {
            echo '# CPA association continuity audit'
            echo
            echo '```text'
            cat build/cpa-association-continuation-audit/contract.log
            echo "${summary}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate no-cold-reference observable certificate
        run: |
          set -euo pipefail
          build/cpa-association-continuation-audit/mpmc_cpa_association_certificate_roundoff_audit \
            | tee build/cpa-association-continuation-audit/certificate.log
          summary="$(grep 'CPA_ASSOC_NO_COLD_CERTIFICATE_SUMMARY' build/cpa-association-continuation-audit/certificate.log)"
          test -n "${summary}"
          {
            echo
            echo '# CPA no-cold-reference observable certificate'
            echo
            echo '```text'
            echo "${summary}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
