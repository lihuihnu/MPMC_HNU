name: Hosted Web model product
permissions:
  contents: read
concurrency:
  group: hosted-web-model-product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  incremental-path-gate:
    name: Incremental path gate
    uses: ./.github/workflows/_incremental_path_gate.yml
    with:
      paths_json: '["api/**","deploy/pt-grpc-web/**","modules/pt_process/**","modules/model_configuration/**","modules/model_configuration_grpc/**","frontend/package.json","frontend/package-lock.json","frontend/src/**",".github/workflows/hosted_web_model_product.yml"]'
  hosted-web-model:
    needs: incremental-path-gate
    if: needs.incremental-path-gate.outputs.affected == 'true'
    name: Chrome → trusted edge → native Classic PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pinned native model-service dependencies
      run: "sudo apt-get update\nsudo apt-get install --yes --no-install-recommends \\\n  libgrpc++-dev=1.51.1-4.1build5 \\\n  protobuf-compiler-grpc=1.51.1-4.1build5\
        \ \\\n  libprotobuf-dev=3.21.12-8.2ubuntu0.3 \\\n  protobuf-compiler=3.21.12-8.2ubuntu0.3\n"
    - name: Generate isolated edge/backend test identities
      run: "set -euo pipefail\ncert_dir=\"${PWD}/build/hosted-web-certs\"\nmkdir -p \"${cert_dir}\"\n\nissue_ca() {\n  local name=$1\n  openssl req -x509 -newkey\
        \ rsa:2048 -nodes -sha256 -days 1 \\\n    -subj \"/CN=${name}\" \\\n    -keyout \"${cert_dir}/${name}.key\" \\\n    -out \"${cert_dir}/${name}.crt\"\n}\n\
        issue_identity() {\n  local name=$1\n  local common_name=$2\n  local authority=$3\n  local extension=$4\n  openssl req -newkey rsa:2048 -nodes -sha256 \\\n\
        \    -subj \"/CN=${common_name}\" -addext \"${extension}\" \\\n    -keyout \"${cert_dir}/${name}.key\" \\\n    -out \"${cert_dir}/${name}.csr\"\n  openssl\
        \ x509 -req -sha256 -days 1 -copy_extensions copy \\\n    -in \"${cert_dir}/${name}.csr\" \\\n    -CA \"${cert_dir}/${authority}.crt\" \\\n    -CAkey \"${cert_dir}/${authority}.key\"\
        \ \\\n    -CAcreateserial -out \"${cert_dir}/${name}.crt\"\n}\n\nissue_ca backend-ca\nissue_ca edge-ca\nissue_ca public-ca\nissue_ca browser-ca\nissue_identity\
        \ backend pt-backend.internal backend-ca \\\n  \"subjectAltName=DNS:pt-backend.internal\"\nissue_identity edge envoy-edge edge-ca \\\n  \"extendedKeyUsage=clientAuth\"\
        \nissue_identity public api.example.test public-ca \\\n  \"subjectAltName=DNS:api.example.test\"\nissue_identity browser browser-test-client browser-ca \\\
        \n  \"extendedKeyUsage=clientAuth\"\nchmod 0644 \"${cert_dir}\"/*.crt \"${cert_dir}\"/*.key\n"
    - name: Configure and build production model-session host
      run: "cmake -S tests/runtime/pt_process_host \\\n  -B build/hosted-web-process-host \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_CXX_COMPILER=g++ \\\n  -DMPMC_PT_PROCESS_ENABLE_SANITIZERS=OFF\
        \ \\\n  -DMPMC_PT_PROCESS_TEST_CERT_DIR=\"${PWD}/build/hosted-web-certs\"\ncmake --build build/hosted-web-process-host \\\n  --target mpmc_pt_service_host\
        \ --parallel 2\n"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.21.0
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Build shared hosted Classic PR frontend
      working-directory: frontend
      run: 'npm ci --ignore-scripts --no-audit --no-fund

        npm run proto:model:generate

        ./node_modules/.bin/vite build

        '
    - name: Verify hosted browser runtime
      run: 'google-chrome --version

        test -x "${CHROMEWEBDRIVER}/chromedriver"

        "${CHROMEWEBDRIVER}/chromedriver" --version

        '
    - name: Validate model-enabled production edge
      run: "set -euo pipefail\ncert_dir=\"${PWD}/build/hosted-web-certs\"\npython3 deploy/pt-grpc-web/render_production_config.py \\\n  --public-host api.example.test\
        \ \\\n  --public-origin https://ui.example.test \\\n  --downstream-certificate-chain /run/secrets/public.crt \\\n  --downstream-private-key /run/secrets/public.key\
        \ \\\n  --downstream-client-ca /run/secrets/browser-ca.crt \\\n  --upstream-port 50053 \\\n  --upstream-server-name pt-backend.internal \\\n  --upstream-client-certificate-chain\
        \ /run/secrets/edge.crt \\\n  --upstream-client-private-key /run/secrets/edge.key \\\n  --upstream-server-ca /run/secrets/backend-ca.crt \\\n  --public-port\
        \ 8444 \\\n  --admin-port 9902 \\\n  --model-authz-loopback-port 10003 \\\n  > build/hosted-web-envoy.yaml\ndocker run --rm \\\n  --volume \"${PWD}/build/hosted-web-envoy.yaml:/etc/envoy/envoy.yaml:ro\"\
        \ \\\n  --volume \"${cert_dir}:/run/secrets:ro\" \\\n  envoyproxy/envoy:v1.36.9 \\\n  --mode validate -c /etc/envoy/envoy.yaml\n"
    - name: Run real hosted browser model ownership regression
      run: "set -euo pipefail\ncert_dir=\"${PWD}/build/hosted-web-certs\"\nhost_log=\"${PWD}/build/hosted-web-host.log\"\nauthz_log=\"${PWD}/build/hosted-web-authz.log\"\
        \nenvoy_name=\"mpmc-hosted-web-envoy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\n\nsudo sh -c \"printf '%s\\n' '127.0.0.1 api.example.test' >> /etc/hosts\"\n\
        \n./build/hosted-web-process-host/pt-process-library/mpmc_pt_service_host \\\n  --listen-address 127.0.0.1:50053 \\\n  --tls-certificate-chain \"${cert_dir}/backend.crt\"\
        \ \\\n  --tls-private-key \"${cert_dir}/backend.key\" \\\n  --trusted-edge-client-ca \"${cert_dir}/edge-ca.crt\" \\\n  --enable-model-sessions \\\n  >\"${host_log}\"\
        \ 2>&1 &\nhost_pid=$!\n\npython3 deploy/pt-grpc-web/tests/web_identity_authz_fixture.py \\\n  --port 10003 >\"${authz_log}\" 2>&1 &\nauthz_pid=$!\n\ncleanup()\
        \ {\n  docker rm --force \"${envoy_name}\" >/dev/null 2>&1 || true\n  kill -TERM \"${authz_pid}\" 2>/dev/null || true\n  kill -TERM \"${host_pid}\" 2>/dev/null\
        \ || true\n  wait \"${authz_pid}\" 2>/dev/null || true\n  wait \"${host_pid}\" 2>/dev/null || true\n}\ntrap cleanup EXIT\n\nfor attempt in {1..100}; do\n\
        \  if grep --quiet '\"event\":\"pt_process_ready\"' \"${host_log}\" &&\n     curl --fail --silent http://127.0.0.1:10003/healthz >/dev/null; then\n    break\n\
        \  fi\n  if ! kill -0 \"${host_pid}\" 2>/dev/null; then\n    cat \"${host_log}\"\n    exit 1\n  fi\n  if ! kill -0 \"${authz_pid}\" 2>/dev/null; then\n  \
        \  cat \"${authz_log}\"\n    exit 1\n  fi\n  sleep 0.1\ndone\ngrep --quiet '\"configured_backends\":3' \"${host_log}\"\ncurl --fail --silent http://127.0.0.1:10003/healthz\
        \ >/dev/null\n\ndocker run --detach --rm --network host \\\n  --name \"${envoy_name}\" \\\n  --volume \"${PWD}/build/hosted-web-envoy.yaml:/etc/envoy/envoy.yaml:ro\"\
        \ \\\n  --volume \"${cert_dir}:/run/secrets:ro\" \\\n  envoyproxy/envoy:v1.36.9 \\\n  -c /etc/envoy/envoy.yaml\n\nfor attempt in {1..100}; do\n  if curl --fail\
        \ --silent http://127.0.0.1:9902/ready >/dev/null; then\n    break\n  fi\n  sleep 0.1\ndone\nif ! curl --fail --silent http://127.0.0.1:9902/ready >/dev/null;\
        \ then\n  docker logs \"${envoy_name}\" || true\n  exit 1\nfi\n\npython3 deploy/pt-grpc-web/tests/hosted_web_product_smoke.py \\\n  --dist frontend/dist \\\
        \n  --edge-host api.example.test \\\n  --edge-port 8444 \\\n  --public-ca \"${cert_dir}/public-ca.crt\" \\\n  --client-cert \"${cert_dir}/browser.crt\" \\\
        \n  --client-key \"${cert_dir}/browser.key\" \\\n  --chromedriver \"${CHROMEWEBDRIVER}/chromedriver\"\n\nkill -TERM \"${host_pid}\"\nwait \"${host_pid}\"\n\
        grep --quiet '\"event\":\"pt_process_stopped\"' \"${host_log}\"\ntrap - EXIT\ndocker rm --force \"${envoy_name}\" >/dev/null 2>&1 || true\nkill -TERM \"${authz_pid}\"\
        \ 2>/dev/null || true\nwait \"${authz_pid}\" 2>/dev/null || true\n"
'on':
  workflow_dispatch: null
