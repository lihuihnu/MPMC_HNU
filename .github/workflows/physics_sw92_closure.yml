name: SW92 physics thermodynamic closure


# Main-target PR path matching is owned by pr_incremental_ci.yml. This file
# has no local PR path gate; it only executes routed or explicit manual validation.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-sw92-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            runner: ubuntu-24.04
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            runner: ubuntu-24.04
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            runner: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Python interpreter
        run: |
          if command -v python >/dev/null 2>&1; then
            python_cmd="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_cmd="$(command -v python3)"
          else
            echo "Python interpreter not found" >&2
            exit 1
          fi
          echo "MPMC_PYTHON=$python_cmd" >> "$GITHUB_ENV"

      - name: Regenerate physical Sample-6 oracle
        run: |
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_pt/reference_physical_sample6_decimal.py

      - name: Configure SW92 thermodynamic closure regression
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/physics/sw92_thermodynamic_closure \
            -B build/physics-sw92-closure \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_SW92_THERMODYNAMIC_CLOSURE_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build SW92 thermodynamic closure regression
        run: cmake --build build/physics-sw92-closure --target mpmc_sw92_thermodynamic_closure_tests --config ${{ matrix.config }} --parallel 2
      - name: Run SW92 thermodynamic closure regression
        run: ctest --test-dir build/physics-sw92-closure -C ${{ matrix.config }} -R '^physics[.]sw92_thermodynamic_closure[.]' --verbose --no-tests=error
