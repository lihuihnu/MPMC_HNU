name: PT phase split
on:
  pull_request:
    branches: [main, feat/pt-stability-tpd, feat/pt-vle-split, test/pt-boundary-regression, fix/tpd-flat-descent, test/pt-dew-limit-audit]
    paths:
      - 'modules/flash/include/mpmc/flash/pt_stability.hpp'
      - 'modules/flash/include/mpmc/flash/pr76_stability.hpp'
      - 'modules/flash/include/mpmc/flash/rachford_rice.hpp'
      - 'modules/flash/include/mpmc/flash/pt_split.hpp'
      - 'modules/flash/include/mpmc/flash/pr76_split.hpp'
      - 'modules/flash/CMakeLists.txt'
      - 'modules/thermodynamics/**/*.hpp'
      - 'modules/thermodynamics/**/CMakeLists.txt'
      - 'tests/flash/pt_split/**'
      - '.github/workflows/pt_split.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pt-phase-split-${{ github.ref }}
  cancel-in-progress: true
jobs:
  split:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure only phase split integration
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/pt_split -B build/pt-split \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_SPLIT_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Compile phase split, boundary and ternary regression
        run: cmake --build build/pt-split --target mpmc_pt_split_tests mpmc_pt_boundary_tests mpmc_tpd_stagnation_tests mpmc_dew_limit_tests mpmc_pt_diagnostic_tests mpmc_pt_ternary_tests --config ${{ matrix.config }} --parallel 2
      - name: Run phase split increment
        run: ctest --test-dir build/pt-split -C ${{ matrix.config }} -R '^flash[.]pt_split[.]' --verbose --no-tests=error
      - name: Independently regenerate binary equilibrium references
        run: python tests/flash/pt_split/reference_split_decimal.py
      - name: Independently regenerate ternary equilibrium references
        run: python tests/flash/pt_split/reference_ternary_decimal.py
      - name: Independently check saturation and continuous boundary references
        run: python tests/flash/pt_split/reference_boundary_decimal.py
      - name: Cross-check boundary reference precision on the sanitizer configuration
        if: matrix.sanitizer == 'ON'
        run: python tests/flash/pt_split/reference_boundary_decimal.py --precision 96
      - name: Independently audit near-dew input resolution and phase gate
        run: python tests/flash/pt_split/reference_dew_limit_decimal.py
      - name: Cross-check near-dew reference precision
        if: matrix.sanitizer == 'ON'
        run: python tests/flash/pt_split/reference_dew_limit_decimal.py --precision 96
