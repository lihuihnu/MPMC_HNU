name: CPA PT stability

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/flash/include/mpmc/flash/cpa_stability.hpp'
      - 'modules/flash/include/mpmc/flash/pt_stability.hpp'
      - 'modules/thermodynamics/include/mpmc/thermodynamics/cpa_*.hpp'
      - 'tests/flash/cpa_stability/**'
      - '.github/workflows/cpa_stability.yml'
      - '.github/workflows/_cpp_ctest.yml'
      - 'tests/support/cmake/cpp_test_options.cmake'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpa-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpa-stability:
    uses: ./.github/workflows/_cpp_ctest.yml
    with:
      source_dir: tests/flash/cpa_stability
      build_dir: build/cpa-stability
      targets: mpmc_cpa_stability_tests mpmc_cpa_stability_headers
      test_regex: '^flash[.]cpa_stability[.]'
      sanitizer_option: MPMC_CPA_STABILITY_ENABLE_SANITIZERS
      timeout_minutes: 30
