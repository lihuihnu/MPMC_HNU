name: SW92 phase-assigned C2b2 topology closure

# Main-target PR path matching is owned by pr_incremental_ci.yml. Manual and
# reusable entry points delegate to the shared topology closure so dependency
# gates execute at most once per platform.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: sw92-phase-assigned-c2b2-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c2b2:
    uses: ./.github/workflows/_sw92_phase_assigned_topology.yml
    with:
      run_three_phase_closure: true
