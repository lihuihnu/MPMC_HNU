name: AD correctness

on:
  workflow_call:
    inputs:
      matrix_json:
        description: Audited AD matrix selected by the PR impact router.
        required: true
        type: string
    outputs:
      validated:
        description: Routed AD matrix completed successfully.
        value: ${{ jobs.validation-result.outputs.validated }}
  workflow_dispatch:
    inputs:
      suite:
        description: 'Audited test scope; all is the default for manual validation'
        type: choice
        options: [all, arithmetic, math, jacobian, runtime]
        default: all

permissions:
  contents: read

concurrency:
  group: ad-${{ inputs.matrix_json != '' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  manual-select:
    name: Select manual AD suite
    if: ${{ inputs.matrix_json == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - name: Build requested manual matrix
        id: scope
        shell: python
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          import json
          import os

          all_suites = ["arithmetic", "jacobian", "math", "runtime"]
          requested = os.environ.get("REQUESTED_SUITE") or "all"
          if requested not in ["all", *all_suites]:
              raise ValueError("Unknown requested AD suite")
          selected = all_suites if requested == "all" else [requested]
          platforms = [
              {"name": "GCC Debug + ASan/UBSan", "os": "ubuntu-24.04", "runner": "ubuntu-24.04",
               "build_type": "Debug", "compiler": "-DCMAKE_CXX_COMPILER=g++", "sanitizer": "ON"},
              {"name": "Clang Release", "os": "ubuntu-24.04", "runner": "ubuntu-24.04",
               "build_type": "Release", "compiler": "-DCMAKE_CXX_COMPILER=clang++", "sanitizer": "OFF"},
              {"name": "MSVC Release", "os": "windows-2022", "runner": "windows-2022",
               "build_type": "Release", "compiler": "", "sanitizer": "OFF"},
          ]
          matrix = {"include": [{**platform, "suite": suite} for suite in selected for platform in platforms]}
          print("Selected manual suites:", selected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")

  ad:
    needs: manual-select
    if: ${{ always() && (inputs.matrix_json != '' || needs.manual-select.result == 'success') }}
    name: ${{ matrix.suite }} / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix_json != '' && inputs.matrix_json || needs.manual-select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the selected suite
        run: |
          source_dir=.
          if [ "${{ matrix.suite }}" = math ]; then source_dir=tests/ad/math; fi
          if [ "${{ matrix.suite }}" = jacobian ]; then source_dir=tests/ad/jacobian; fi
          if [ "${{ matrix.suite }}" = runtime ]; then source_dir=tests/ad/runtime; fi
          cmake -S "$source_dir" -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.compiler }} -DMPMC_AD_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Compile only the selected target
        run: |
          target=mpmc_ad_tests
          if [ "${{ matrix.suite }}" = math ]; then target=mpmc_ad_math_tests; fi
          if [ "${{ matrix.suite }}" = jacobian ]; then target=mpmc_ad_jacobian_tests; fi
          if [ "${{ matrix.suite }}" = runtime ]; then target=mpmc_ad_runtime_tests; fi
          cmake --build build --target "$target" --config ${{ matrix.build_type }} --parallel 2
      - name: Run only the selected tests
        run: |
          pattern='^ad[.]dual$'
          if [ "${{ matrix.suite }}" = math ]; then pattern='^ad[.]math[.]'; fi
          if [ "${{ matrix.suite }}" = jacobian ]; then pattern='^ad[.]jacobian[.]'; fi
          if [ "${{ matrix.suite }}" = runtime ]; then pattern='^ad[.]runtime[.]'; fi
          ctest --test-dir build -C ${{ matrix.build_type }} -R "$pattern" --verbose --no-tests=error
      - name: Arithmetic standalone consumer
        if: matrix.suite == 'arithmetic'
        run: |
          cmake -S tests/ad/standalone -B build/standalone \
            "-DMPMC_AD_SOURCE_DIR=${{ github.workspace }}/modules/ad" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.compiler }}
          cmake --build build/standalone --config ${{ matrix.build_type }} --parallel 2
          ctest --test-dir build/standalone -C ${{ matrix.build_type }} --verbose --no-tests=error

  validation-result:
    name: AD reusable result
    needs:
      - manual-select
      - ad
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      validated: ${{ steps.verdict.outputs.validated }}
    steps:
      - name: Validate routed/manual AD result
        id: verdict
        shell: bash
        env:
          ROUTED: ${{ inputs.matrix_json != '' }}
          SELECT_RESULT: ${{ needs.manual-select.result }}
          AD_RESULT: ${{ needs.ad.result }}
        run: |
          set -euo pipefail
          if [[ "$ROUTED" == "true" ]]; then
            test "$AD_RESULT" = "success"
          else
            test "$SELECT_RESULT" = "success"
            test "$AD_RESULT" = "success"
          fi
          echo "validated=true" >> "$GITHUB_OUTPUT"
