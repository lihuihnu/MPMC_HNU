name: AD correctness

# Validate affected suites on the PR; do not rerun the same tree on merge.
on:
  pull_request:
    branches: [main]
    # Before configuring required checks, use an always-reporting outer gate.
    paths:
      - 'modules/ad/**'
      - 'tests/ad/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/ad.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Audited test scope; all is the default for infrastructure changes'
        type: choice
        options: [all, arithmetic, math, jacobian, runtime]
        default: all

permissions:
  contents: read

concurrency:
  group: ad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select affected AD suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      has_work: ${{ steps.scope.outputs.has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR merge commit and its two parents suffice for a two-tree diff.
          fetch-depth: 2
      - name: Select by audited dependency boundaries
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_SUITE: ${{ inputs.suite }}
        shell: python
        run: |
          import json
          import os
          import subprocess

          all_suites = ["arithmetic", "jacobian", "math", "runtime"]

          def suites_for(paths):
              selected = set()
              infrastructure = False
              shared = {
                  "modules/ad/include/mpmc/ad/dual.hpp", "modules/ad/CMakeLists.txt",
                  "CMakeLists.txt", "CMakePresets.json",
              }
              for path in paths:
                  if path.endswith(".md"):
                      continue
                  if path == ".github/workflows/ad.yml":
                      infrastructure = True
                  elif path in shared:
                      selected.update(all_suites)
                  elif path == "modules/ad/include/mpmc/ad/runtime_differentiate.hpp" or path.startswith("tests/ad/runtime/"):
                      selected.add("runtime")
                  elif path == "modules/ad/include/mpmc/ad/differentiate.hpp":
                      selected.update(("jacobian", "runtime"))  # Runtime crosscheck uses the fixed API.
                  elif path.startswith("tests/ad/jacobian/"):
                      selected.add("jacobian")
                  elif path == "modules/ad/include/mpmc/ad/math.hpp":
                      selected.update(("jacobian", "math", "runtime"))  # Integration tests use math.hpp.
                  elif path.startswith("tests/ad/math/"):
                      selected.add("math")
                  elif path.startswith("tests/ad/"):
                      selected.add("arithmetic")
                  else:
                      selected.update(all_suites)  # Unknown dependency: be conservative.
              # Workflow-only changes require all suites. When a workflow change
              # accompanies code, audit its scope: compiler/flags/environment changes
              # affecting an additional suite MUST dispatch 'all' before integration.
              if infrastructure and not selected:
                  selected.update(all_suites)
              return sorted(selected)

          # Necessary regression checks for this newly introduced selection logic.
          checks = [
              (["modules/ad/include/mpmc/ad/math.hpp"], ["jacobian", "math", "runtime"]),
              (["tests/ad/math/math_test.cpp", ".github/workflows/ad.yml"], ["math"]),
              (["modules/ad/include/mpmc/ad/dual.hpp"], all_suites),
              (["tests/ad/dual_test.cpp"], ["arithmetic"]),
              ([".github/workflows/ad.yml"], all_suites),
              (["modules/ad/include/mpmc/ad/unknown.hpp"], all_suites),
              (["README.md"], []),
              (["modules/ad/include/mpmc/ad/differentiate.hpp"], ["jacobian", "runtime"]),
              (["tests/ad/jacobian/jacobian_test.cpp", ".github/workflows/ad.yml"], ["jacobian"]),
              (["modules/ad/include/mpmc/ad/differentiate.hpp", "AGENTS.md"], ["jacobian", "runtime"]),
              (["tests/ad/math/math_test.cpp", "tests/ad/jacobian/header_self_contained.cpp"],
               ["jacobian", "math"]),
              (["CMakeLists.txt"], all_suites),
              (["modules/ad/include/mpmc/ad/runtime_differentiate.hpp"], ["runtime"]),
              (["tests/ad/runtime/runtime_test.cpp", ".github/workflows/ad.yml"], ["runtime"]),
              (["tests/ad/runtime/header_self_contained.cpp"], ["runtime"]),
              (["modules/ad/include/mpmc/ad/runtime_differentiate.hpp", "AGENTS.md"], ["runtime"]),
              (["modules/ad/include/mpmc/ad/math.hpp", "tests/ad/runtime/runtime_test.cpp"],
               ["jacobian", "math", "runtime"]),
              (["modules/ad/runtime_differentiate.md"], []),
          ]
          for paths, expected in checks:
              if suites_for(paths) != expected:
                  raise RuntimeError(f"Invalid suite selection for {paths}")

          print(f"Suite-selection regressions: {len(checks)}/{len(checks)} passed")

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              requested = os.environ.get("REQUESTED_SUITE") or "all"
              if requested not in ["all", *all_suites]:
                  raise ValueError("Unknown requested AD suite")
              selected = all_suites if requested == "all" else [requested]
          else:
              raw = subprocess.check_output([
                  "git", "diff", "--name-only", "-z",
                  os.environ["BASE_SHA"], os.environ["HEAD_SHA"],
              ])
              paths = [p for p in raw.decode("utf-8").split("\0") if p]
              print("Changed paths:", json.dumps(paths, ensure_ascii=False))
              selected = suites_for(paths)
          platforms = [
              {"name": "GCC Debug + ASan/UBSan", "os": "ubuntu-24.04", "build_type": "Debug",
               "compiler": "-DCMAKE_CXX_COMPILER=g++", "sanitizer": "ON"},
              {"name": "Clang Release", "os": "ubuntu-24.04", "build_type": "Release",
               "compiler": "-DCMAKE_CXX_COMPILER=clang++", "sanitizer": "OFF"},
              {"name": "MSVC Release", "os": "windows-2022", "build_type": "Release",
               "compiler": "", "sanitizer": "OFF"},
          ]
          matrix = {"include": [{**p, "suite": s} for s in selected for p in platforms]}
          print("Selected suites:", selected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix) + "\n")
              output.write("has_work=" + str(bool(selected)).lower() + "\n")

  ad:
    needs: select
    if: needs.select.outputs.has_work == 'true'
    name: ${{ matrix.suite }} / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the selected suite
        run: |
          source_dir=.
          if [ "${{ matrix.suite }}" = math ]; then source_dir=tests/ad/math; fi
          if [ "${{ matrix.suite }}" = jacobian ]; then source_dir=tests/ad/jacobian; fi
          if [ "${{ matrix.suite }}" = runtime ]; then source_dir=tests/ad/runtime; fi
          cmake -S "$source_dir" -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.compiler }} -DMPMC_AD_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Compile only the selected target
        run: |
          target=mpmc_ad_tests
          if [ "${{ matrix.suite }}" = math ]; then target=mpmc_ad_math_tests; fi
          if [ "${{ matrix.suite }}" = jacobian ]; then target=mpmc_ad_jacobian_tests; fi
          if [ "${{ matrix.suite }}" = runtime ]; then target=mpmc_ad_runtime_tests; fi
          cmake --build build --target "$target" --config ${{ matrix.build_type }} --parallel 2
      - name: Run only the selected tests
        run: |
          pattern='^ad[.]dual$'
          if [ "${{ matrix.suite }}" = math ]; then pattern='^ad[.]math[.]'; fi
          if [ "${{ matrix.suite }}" = jacobian ]; then pattern='^ad[.]jacobian[.]'; fi
          if [ "${{ matrix.suite }}" = runtime ]; then pattern='^ad[.]runtime[.]'; fi
          ctest --test-dir build -C ${{ matrix.build_type }} -R "$pattern" --verbose --no-tests=error
      - name: Arithmetic standalone consumer
        if: matrix.suite == 'arithmetic'
        run: |
          cmake -S tests/ad/standalone -B build/standalone \
            "-DMPMC_AD_SOURCE_DIR=${{ github.workspace }}/modules/ad" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.compiler }}
          cmake --build build/standalone --config ${{ matrix.build_type }} --parallel 2
          ctest --test-dir build/standalone -C ${{ matrix.build_type }} --verbose --no-tests=error
