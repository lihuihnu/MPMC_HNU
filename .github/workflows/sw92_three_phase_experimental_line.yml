name: SW92 experimental three-phase line
permissions:
  contents: read
concurrency:
  group: sw92-three-phase-experimental-line-${{ github.ref }}
  cancel-in-progress: true
jobs:
  incremental-path-gate:
    name: Incremental path gate
    uses: ./.github/workflows/_incremental_path_gate.yml
    with:
      paths_json: '["tests/flash/sw92_three_phase_experimental_line/**","tests/support/sw92/test_support.hpp","modules/flash/sw92_three_phase_experimental_validation.md",".github/workflows/sw92_three_phase_experimental_line.yml"]'
  experimental-line:
    needs: incremental-path-gate
    if: needs.incremental-path-gate.outputs.affected == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: GCC Debug + ASan/UBSan
          os: ubuntu-24.04
          runner: ubuntu-24.04
          config: Debug
          compiler: -DCMAKE_CXX_COMPILER=g++
          sanitizer: 'ON'
        - name: Clang Release
          os: ubuntu-24.04
          runner: ubuntu-24.04
          config: Release
          compiler: -DCMAKE_CXX_COMPILER=clang++
          sanitizer: 'OFF'
        - name: MSVC Release
          os: windows-2022
          runner: windows-2022
          config: Release
          compiler: ''
          sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Independently solve and compare experimental triple line
      run: python tests/flash/sw92_three_phase_experimental_line/reference_decimal.py
    - name: Configure experimental three-phase regression
      run: "config_arg=()\nif [ \"${{ runner.os }}\" != Windows ]; then\n  config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})\nfi\ncmake -S tests/flash/sw92_three_phase_experimental_line\
        \ \\\n  -B build/sw92-three-phase-experimental-line \\\n  \"${config_arg[@]}\" ${{ matrix.compiler }} \\\n  -DMPMC_SW92_THREE_PHASE_EXPERIMENTAL_LINE_ENABLE_SANITIZERS=${{\
        \ matrix.sanitizer }}\n"
    - name: Build experimental three-phase regression
      run: cmake --build build/sw92-three-phase-experimental-line --target mpmc_sw92_three_phase_experimental_line_tests --config ${{ matrix.config }} --parallel
        2
    - name: Run experimental three-phase regression
      run: ctest --test-dir build/sw92-three-phase-experimental-line -C ${{ matrix.config }} -R '^flash[.]sw92_three_phase_experimental_line[.]' --verbose --no-tests=error
'on':
  workflow_dispatch: null
