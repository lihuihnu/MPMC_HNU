name: Public thermodynamic model configuration

# Main-target PR path matching is owned by pr_incremental_ci.yml. This file
# has no local PR path gate; it only executes routed or explicit manual validation.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-configuration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parameters:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            runner: mpmc_hnu
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            config: Debug
            sanitizers: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            runner: mpmc_hnu
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            config: Release
            sanitizers: 'OFF'
          - name: MSVC Release
            os: windows-2022
            runner: windows-2022
            compiler: ''
            config: Release
            sanitizers: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure public parameter contract
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/model_configuration/parameters -B build/model-parameters \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_MODEL_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build public parameter contract
        run: cmake --build build/model-parameters --config ${{ matrix.config }} --parallel 2
      - name: Run public parameter contract
        run: ctest --test-dir build/model-parameters -C ${{ matrix.config }} -R '^model[.]parameters[.]' --verbose --no-tests=error
      - name: Configure solver settings and PR76 parity
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/model_configuration/solver_settings -B build/solver-settings \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_SOLVER_SETTINGS_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build solver settings and PR76 parity
        run: cmake --build build/solver-settings --config ${{ matrix.config }} --parallel 2
      - name: Run solver settings and PR76 parity
        run: ctest --test-dir build/solver-settings -C ${{ matrix.config }} -R '^model[.]solver_settings[.]' --verbose --no-tests=error
      - name: Configure executable model and isolation
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/model_configuration/executable_model -B build/executable-model \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_EXECUTABLE_MODEL_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build executable model and isolation
        run: cmake --build build/executable-model --config ${{ matrix.config }} --parallel 2
      - name: Run executable model and isolation
        run: ctest --test-dir build/executable-model -C ${{ matrix.config }} -R '^model[.]executable[.]' --verbose --no-tests=error
      - name: Configure bounded registry and solve lifetime
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/model_configuration/registry -B build/model-registry \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_REGISTRY_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build bounded registry and solve lifetime
        run: cmake --build build/model-registry --config ${{ matrix.config }} --parallel 2
      - name: Run bounded registry and solve lifetime
        run: ctest --test-dir build/model-registry -C ${{ matrix.config }} -R '^model[.]registry[.]' --verbose --no-tests=error
      - name: Verify reused thermodynamics parameter authority
        if: matrix.sanitizers == 'ON'
        run: |
          cmake -S tests/thermodynamics/contracts -B build/thermo-contracts \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DMPMC_THERMO_ENABLE_SANITIZERS=ON
          cmake --build build/thermo-contracts --parallel 2
          ctest --test-dir build/thermo-contracts -R '^thermo[.]contracts[.]' --verbose --no-tests=error
