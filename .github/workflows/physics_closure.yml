name: Physics thermodynamic closure
# Main-target PR path matching is owned by pr_incremental_ci.yml. This file
# has no local PR path gate; it only executes routed or explicit manual validation.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physics-thermodynamic-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  closure:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            runner: ubuntu-24.04
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            runner: ubuntu-24.04
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            runner: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Python interpreter
        run: |
          if command -v python >/dev/null 2>&1; then
            python_cmd="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_cmd="$(command -v python3)"
          else
            echo "Python interpreter not found" >&2
            exit 1
          fi
          echo "MPMC_PYTHON=$python_cmd" >> "$GITHUB_ENV"

      - name: Configure only physics thermodynamic closure
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/physics/thermodynamic_closure -B build/physics-closure \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_PHYSICS_CLOSURE_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Compile physics thermodynamic closure regression
        run: cmake --build build/physics-closure --target mpmc_physics_closure_tests --config ${{ matrix.config }} --parallel 2
      - name: Run physics thermodynamic closure increment
        run: ctest --test-dir build/physics-closure -C ${{ matrix.config }} -R '^physics[.]thermodynamic_closure[.]' --verbose --no-tests=error
      - name: Independently regenerate closure references
        run: |
          "$MPMC_PYTHON" tests/physics/thermodynamic_closure/reference_closure_decimal.py
