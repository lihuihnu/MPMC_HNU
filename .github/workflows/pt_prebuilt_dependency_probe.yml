name: PT prebuilt dependency probe

on:
  push:
    branches: [feat/cross-platform-product-staging-v1]
    paths:
      - '.github/workflows/pt_prebuilt_dependency_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pt-prebuilt-dependency-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 Release
            os: ubuntu-24.04
            conan_settings: -s compiler.cppstd=17
          - name: Windows x64 Release
            os: windows-2022
            # ConanCenter's MSVC binaries use the VS 2022 v143 package ID.
            conan_settings: -s compiler.cppstd=17 -s compiler.version=193
          - name: macOS arm64 Release
            os: macos-15
            conan_settings: -s compiler.cppstd=17

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Conan client
        run: python -m pip install --disable-pip-version-check conan==2.32.0

      - name: Detect hosted compiler profile
        run: conan profile detect --force

      - name: Require complete prebuilt dependency graph
        run: >-
          conan install
          --requires=grpc/1.83.1
          --requires=protobuf/6.33.5
          --requires=openssl/3.6.4
          --requires=abseil/20260107.1
          --requires=re2/20251105
          --requires=c-ares/1.34.8
          --requires=zlib/1.3.2
          -s build_type=Release
          ${{ matrix.conan_settings }}
          -o grpc/*:secure=True
          --build=never
          --format=json
          --output-folder=build/conan-probe
