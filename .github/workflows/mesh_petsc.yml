name: Mesh/discretization PETSc adapter correctness

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/mesh/include/**'
      - 'modules/mesh_petsc/**'
      - 'modules/discretization/**'
      - 'modules/discretization_petsc/**'
      - 'modules/flow_discretization/include/mpmc/flow_discretization/owned_multi_cell_component_conservation.hpp'
      - 'tests/mesh/petsc/**'
      - '.github/workflows/mesh_petsc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-discretization-petsc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incremental-path-gate:
    name: Incremental path gate
    uses: ./.github/workflows/_incremental_path_gate.yml
    with:
      paths_json: >-
        ["modules/mesh/include/**","modules/mesh_petsc/**","modules/discretization/**","modules/discretization_petsc/**","modules/flow_discretization/include/mpmc/flow_discretization/owned_multi_cell_component_conservation.hpp","tests/mesh/petsc/**",".github/workflows/mesh_petsc.yml"]

  petsc:
    needs: incremental-path-gate
    if: needs.incremental-path-gate.outputs.affected == 'true'
    name: PETSc 3.19.6 mesh/discretization synthetic MPI
    runs-on: [self-hosted, linux, x64, mpmc_hnu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned PETSc and MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpetsc-real3.19-dev=3.19.6+dfsg1-2.2ubuntu2 \
            openmpi-bin
          test "$(pkg-config --modversion PETSc)" = "3.19.6"
          command -v mpiexec

      - name: Configure mesh/discretization PETSc tests
        run: |
          cmake -S tests/mesh/petsc -B build/mesh-petsc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build mesh/discretization PETSc tests
        run: |
          cmake --build build/mesh-petsc \
            --target mpmc_mesh_discretization_petsc_tests \
            --parallel 2

      - name: Run PETSc MPI integration tests
        run: |
          ctest --test-dir build/mesh-petsc \
            -R '^(mesh|discretization)[.]petsc[.]' \
            --verbose \
            --no-tests=error
