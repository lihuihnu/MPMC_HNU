name: Mesh external format compatibility
permissions:
  contents: read
concurrency:
  group: mesh-external-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  incremental-path-gate:
    name: Incremental path gate
    uses: ./.github/workflows/_incremental_path_gate.yml
    with:
      paths_json: '["modules/mesh/include/mpmc/mesh/gmsh_4_1.hpp","modules/mesh/include/mpmc/mesh/gmsh_4_1_3d.hpp","modules/mesh/include/mpmc/mesh/vtu.hpp","modules/mesh/include/mpmc/mesh/vtu_3d.hpp","modules/mesh/include/mpmc/mesh/grdecl.hpp","modules/mesh/include/mpmc/mesh/grdecl_reconstruction.hpp","modules/mesh/include/mpmc/mesh/mesh_exchange.hpp","modules/mesh/include/mpmc/mesh/mesh_exchange_io.hpp","modules/mesh/include/mpmc/mesh/active_corner_point.hpp","modules/mesh/include/mpmc/mesh/corner_point_geometry_3d.hpp","modules/mesh/include/mpmc/mesh/csr_adjacency.hpp","modules/mesh/include/mpmc/mesh/dense_field.hpp","modules/mesh/include/mpmc/mesh/dense_field_registry.hpp","modules/mesh/include/mpmc/mesh/entity.hpp","modules/mesh/include/mpmc/mesh/face_boundary.hpp","modules/mesh/include/mpmc/mesh/face_geometry_3d.hpp","modules/mesh/include/mpmc/mesh/geometry_2d.hpp","modules/mesh/include/mpmc/mesh/linear_cell_mesh_2d.hpp","modules/mesh/include/mpmc/mesh/linear_cell_mesh_3d.hpp","modules/mesh/include/mpmc/mesh/topology.hpp","tests/mesh/external_compatibility/**",".github/workflows/mesh_external_compatibility.yml"]'
  compatibility:
    needs: incremental-path-gate
    if: needs.incremental-path-gate.outputs.affected == 'true'
    name: Pinned public Gmsh VTU GRDECL samples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download pinned external mesh samples
      shell: bash
      run: 'set -euo pipefail

        mkdir -p build/external-samples


        curl -fsSL --retry 3 https://raw.githubusercontent.com/dealii/dealii/ba22b5843ef01bd0ac5c16a180983b0de61e3a4f/tests/grid/grids/grid_in_msh_01.2d.v41.msh -o
        build/external-samples/dealii-2d.msh

        test "$(git hash-object build/external-samples/dealii-2d.msh)" = "638a419514f00782902edb5abbfbabfd5118c9ce"


        curl -fsSL --retry 3 https://raw.githubusercontent.com/dealii/dealii/ba22b5843ef01bd0ac5c16a180983b0de61e3a4f/tests/grid/grids/grid_in_msh_01.3d.v41.msh -o
        build/external-samples/dealii-3d.msh

        test "$(git hash-object build/external-samples/dealii-3d.msh)" = "7ef8ec2c29d1ce8076629b6ff3da413773e28725"


        curl -fsSL --retry 3 https://raw.githubusercontent.com/dealii/dealii/ba22b5843ef01bd0ac5c16a180983b0de61e3a4f/tests/data_out/data_out_12.with_zlib=off.output
        -o build/external-samples/dealii-vtu-bundle.txt

        test "$(git hash-object build/external-samples/dealii-vtu-bundle.txt)" = "8a758d03cc098b09f128b7c798651ae867253633"


        curl -fsSL --retry 3 https://raw.githubusercontent.com/OPM/opm-verteq/33db570bc86b54593fa351fbb28044b51d2a3238/examples/3d/data/tube.grdecl -o build/external-samples/opm-tube.grdecl

        test "$(git hash-object build/external-samples/opm-tube.grdecl)" = "d6e5ed9993f59b5c432e009289cd5228e76d46fd"


        curl -fsSL --retry 3 https://raw.githubusercontent.com/OPM/opm-upscaling/69fb6d4e38d06bd75a00ffab0368ff79cb2196f0/tests/input_data/grids/27cellsAniso.grdecl
        -o build/external-samples/opm-27cellsAniso.grdecl

        test "$(git hash-object build/external-samples/opm-27cellsAniso.grdecl)" = "c427da4f83663b071c657ecded06bea30da50415"

        '
    - name: Install pinned independent mesh readers
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y python3-venv libglu1-mesa
        python3 -m venv "$RUNNER_TEMP/mesh-readers"
        "$RUNNER_TEMP/mesh-readers/bin/python" -m pip install --only-binary=:all: -r tests/mesh/external_compatibility/requirements-readers.txt
    - name: Configure external compatibility test
      run: 'cmake -S tests/mesh/external_compatibility -B build/mesh-external -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

        '
    - name: Build external compatibility test
      run: 'cmake --build build/mesh-external --target mpmc_mesh_external_compatibility --parallel 2

        '
    - name: Read export and re-read external meshes
      shell: bash
      run: 'set -euo pipefail

        build/mesh-external/mpmc_mesh_external_compatibility build/external-samples/dealii-2d.msh build/external-samples/dealii-3d.msh build/external-samples/dealii-vtu-bundle.txt
        build/external-samples/opm-tube.grdecl build/external-samples/opm-27cellsAniso.grdecl | tee build/external-compatibility.txt

        grep -Fqx ''[PASS] external.mesh.compatibility'' build/external-compatibility.txt

        grep -Fqx ''[PASS] external.grdecl.opm_tube_native_roundtrip'' build/external-compatibility.txt

        grep -Fqx ''[PASS] external.grdecl.opm_tube_to_gmsh'' build/external-compatibility.txt

        grep -Fqx ''matrix.gmsh3d.vtu=lossy'' build/external-compatibility.txt

        grep -Fqx ''matrix.gmsh3d.grdecl=lossy'' build/external-compatibility.txt

        grep -Fqx ''matrix.vtu3d.gmsh=lossy'' build/external-compatibility.txt

        grep -Fqx ''matrix.vtu3d.grdecl=lossy'' build/external-compatibility.txt

        grep -Fqx ''matrix.grdecl.grdecl=lossless'' build/external-compatibility.txt

        grep -Fqx ''grdecl_native_export=implemented_minimal_baseline'' build/external-compatibility.txt

        '
    - name: Independently read 2D exports with Gmsh and VTK
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/mesh-reader-evidence"
        git rev-parse HEAD > "$RUNNER_TEMP/mesh-reader-evidence/commit.txt"
        "$RUNNER_TEMP/mesh-readers/bin/python" -B tests/mesh/external_compatibility/verify_2d_readers.py --producer "$PWD/build/mesh-external/mpmc_mesh_external_compatibility" --output-dir "$RUNNER_TEMP/mesh-reader-evidence/exports" 2>&1 | tee "$RUNNER_TEMP/mesh-reader-evidence/readback.log"
        grep -Fqx '[PASS] independent.mesh.2d_readers files=12 reports=6 negative_controls=5' "$RUNNER_TEMP/mesh-reader-evidence/readback.log"
    - name: Independently read 3D exports with Gmsh and VTK
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/mesh-3d-reader-evidence"
        git rev-parse HEAD > "$RUNNER_TEMP/mesh-3d-reader-evidence/commit.txt"
        "$RUNNER_TEMP/mesh-readers/bin/python" -B tests/mesh/external_compatibility/verify_3d_readers.py --producer "$PWD/build/mesh-external/mpmc_mesh_external_compatibility" --output-dir "$RUNNER_TEMP/mesh-3d-reader-evidence/exports" 2>&1 | tee "$RUNNER_TEMP/mesh-3d-reader-evidence/readback.log"
        grep -Fqx '[PASS] independent.mesh.3d_readers files=24 reports=12 negative_controls=10' "$RUNNER_TEMP/mesh-3d-reader-evidence/readback.log"
    - name: Validate externally generated 3D mixed mesh chains
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/mesh-3d-chain-evidence"
        git rev-parse HEAD > "$RUNNER_TEMP/mesh-3d-chain-evidence/commit.txt"
        "$RUNNER_TEMP/mesh-readers/bin/python" -B tests/mesh/external_compatibility/verify_3d_chains.py --producer "$PWD/build/mesh-external/mpmc_mesh_external_compatibility" --output-dir "$RUNNER_TEMP/mesh-3d-chain-evidence/files" 2>&1 | tee "$RUNNER_TEMP/mesh-3d-chain-evidence/readback.log"
        grep -Fqx '[PASS] independent.mesh.3d_chains inputs=4 chains=8 reports=8 disconnected_chains=8' "$RUNNER_TEMP/mesh-3d-chain-evidence/readback.log"
    - name: Preserve 3D chain evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mesh-3d-chain-readback
        path: ${{ runner.temp }}/mesh-3d-chain-evidence
        if-no-files-found: warn
        retention-days: 14
    - name: Validate externally generated 2D mixed mesh chains
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/mesh-2d-chain-evidence"
        git rev-parse HEAD > "$RUNNER_TEMP/mesh-2d-chain-evidence/commit.txt"
        "$RUNNER_TEMP/mesh-readers/bin/python" -B tests/mesh/external_compatibility/verify_2d_chains.py --producer "$PWD/build/mesh-external/mpmc_mesh_external_compatibility" --output-dir "$RUNNER_TEMP/mesh-2d-chain-evidence/files" 2>&1 | tee "$RUNNER_TEMP/mesh-2d-chain-evidence/readback.log"
        grep -Fqx '[PASS] independent.mesh.2d_chains inputs=2 chains=4 reports=4 disconnected_chains=4' "$RUNNER_TEMP/mesh-2d-chain-evidence/readback.log"
    - name: Preserve 2D chain evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mesh-2d-chain-readback
        path: ${{ runner.temp }}/mesh-2d-chain-evidence
        if-no-files-found: warn
        retention-days: 14
    - name: Preserve 3D independent reader evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mesh-3d-independent-readback
        path: ${{ runner.temp }}/mesh-3d-reader-evidence
        if-no-files-found: warn
        retention-days: 14
    - name: Preserve independent reader evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mesh-2d-independent-readback
        path: ${{ runner.temp }}/mesh-reader-evidence
        if-no-files-found: warn
        retention-days: 14
    - name: Publish compatibility summary
      shell: bash
      run: "{\n  echo '## External mesh compatibility'\n  echo\n  echo 'Pinned upstream samples are downloaded only for this run and verified by Git blob SHA.'\n\
        \  echo\n  echo '~~~text'\n  cat build/external-compatibility.txt\n  echo '~~~'\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
'on':
  workflow_dispatch: null
