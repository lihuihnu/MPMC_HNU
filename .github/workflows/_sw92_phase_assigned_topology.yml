name: SW92 phase-assigned topology dependency closure

on:
  workflow_call:
    inputs:
      run_three_phase:
        description: Run the C2b1 three-phase terminal gate and its dependencies.
        required: false
        type: boolean
        default: false
      run_three_phase_closure:
        description: Run the C2b2 topology-closure terminal gate and its dependencies.
        required: false
        type: boolean
        default: false
      run_boundary:
        description: Run the three-phase boundary terminal gate and its dependencies.
        required: false
        type: boolean
        default: false
      run_pt:
        description: Run the top-level Profile-C PT gate and its historical dependencies.
        required: false
        type: boolean
        default: false
      run_phase_set_dependencies:
        description: Run only the PT and boundary dependencies of the publication phase-set gate.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  topology:
    if: ${{ inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt || inputs.run_phase_set_dependencies }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            runner: mpmc_hnu
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            runner: mpmc_hnu
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            runner: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Python interpreter
        run: |
          if command -v python >/dev/null 2>&1; then
            python_cmd="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_cmd="$(command -v python3)"
          else
            echo "Python interpreter not found" >&2
            exit 1
          fi
          echo "MPMC_PYTHON=$python_cmd" >> "$GITHUB_ENV"

      - name: Regenerate shared topology references
        if: ${{ inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt }}
        run: |
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_joint/reference_decimal.py
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_joint/reference_c2_domain_decimal.py
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_h_side_witness/reference_decimal.py
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_three_phase/reference_decimal.py
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_three_phase_closure/reference_decimal.py

      - name: Regenerate Profile-C PT auxiliary references
        if: inputs.run_pt
        run: |
          "$MPMC_PYTHON" tests/flash/sw92_family_vle/reference_decimal.py
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_no_w/reference_decimal.py

      - name: Regenerate physical boundary oracle
        if: inputs.run_boundary || inputs.run_pt || inputs.run_phase_set_dependencies
        run: |
          "$MPMC_PYTHON" tests/flash/sw92_phase_assigned_pt/reference_physical_sample6_decimal.py

      - name: Configure Profile-C Gate C1
        if: ${{ inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt }}
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_joint -B build/sw92-phase-assigned-joint             "${config_arg[@]}" ${{ matrix.compiler }}             -DMPMC_SW92_PHASE_ASSIGNED_JOINT_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build Profile-C Gate C1
        if: ${{ inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt }}
        run: cmake --build build/sw92-phase-assigned-joint --target mpmc_sw92_phase_assigned_joint_tests --config ${{ matrix.config }} --parallel 2
      - name: Run Profile-C Gate C1
        if: ${{ inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt }}
        run: ctest --test-dir build/sw92-phase-assigned-joint -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_joint[.]' --verbose --no-tests=error

      - name: Configure Profile-C Gate C2a1
        if: ${{ inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt }}
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_h_side_witness -B build/sw92-phase-assigned-h-side-witness             "${config_arg[@]}" ${{ matrix.compiler }}             -DMPMC_SW92_PHASE_ASSIGNED_H_SIDE_WITNESS_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build Profile-C Gate C2a1
        if: ${{ inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt }}
        run: cmake --build build/sw92-phase-assigned-h-side-witness --target mpmc_sw92_phase_assigned_h_side_witness_tests --config ${{ matrix.config }} --parallel 2
      - name: Run Profile-C Gate C2a1
        if: ${{ inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt }}
        run: ctest --test-dir build/sw92-phase-assigned-h-side-witness -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_h_side_witness[.]' --verbose --no-tests=error

      - name: Configure Profile-C Gate C2b1
        if: inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_pt
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_three_phase -B build/sw92-phase-assigned-three-phase             "${config_arg[@]}" ${{ matrix.compiler }}             -DMPMC_SW92_PHASE_ASSIGNED_THREE_PHASE_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build Profile-C Gate C2b1
        if: inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_pt
        run: cmake --build build/sw92-phase-assigned-three-phase --target mpmc_sw92_phase_assigned_three_phase_tests --config ${{ matrix.config }} --parallel 2
      - name: Run Profile-C Gate C2b1
        if: inputs.run_three_phase || inputs.run_three_phase_closure || inputs.run_pt
        run: ctest --test-dir build/sw92-phase-assigned-three-phase -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_three_phase[.]' --verbose --no-tests=error

      - name: Configure Profile-C Gate C2b2
        if: inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_three_phase_closure -B build/sw92-phase-assigned-three-phase-closure             "${config_arg[@]}" ${{ matrix.compiler }}             -DMPMC_SW92_PHASE_ASSIGNED_THREE_PHASE_CLOSURE_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build Profile-C Gate C2b2
        if: inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt
        run: cmake --build build/sw92-phase-assigned-three-phase-closure --target mpmc_sw92_phase_assigned_three_phase_closure_tests --config ${{ matrix.config }} --parallel 2
      - name: Run Profile-C Gate C2b2
        if: inputs.run_three_phase_closure || inputs.run_boundary || inputs.run_pt
        run: ctest --test-dir build/sw92-phase-assigned-three-phase-closure -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_three_phase_closure[.]' --verbose --no-tests=error

      - name: Configure Profile-C no-W
        if: inputs.run_boundary || inputs.run_pt
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_no_w -B build/sw92-phase-assigned-no-w             "${config_arg[@]}" ${{ matrix.compiler }}             -DMPMC_SW92_PHASE_ASSIGNED_NO_W_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build Profile-C no-W
        if: inputs.run_boundary || inputs.run_pt
        run: cmake --build build/sw92-phase-assigned-no-w --target mpmc_sw92_phase_assigned_no_w_tests --config ${{ matrix.config }} --parallel 2
      - name: Run Profile-C no-W
        if: inputs.run_boundary || inputs.run_pt
        run: ctest --test-dir build/sw92-phase-assigned-no-w -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_no_w[.]' --verbose --no-tests=error

      - name: Configure top-level Profile-C PT
        if: inputs.run_boundary || inputs.run_pt || inputs.run_phase_set_dependencies
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_pt -B build/sw92-phase-assigned-pt             "${config_arg[@]}" ${{ matrix.compiler }}             -DMPMC_SW92_PHASE_ASSIGNED_PT_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build top-level Profile-C PT
        if: inputs.run_boundary || inputs.run_pt || inputs.run_phase_set_dependencies
        run: cmake --build build/sw92-phase-assigned-pt --target mpmc_sw92_phase_assigned_pt_tests --config ${{ matrix.config }} --parallel 2
      - name: Run top-level Profile-C PT
        if: inputs.run_boundary || inputs.run_pt || inputs.run_phase_set_dependencies
        run: ctest --test-dir build/sw92-phase-assigned-pt -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_pt[.]' --verbose --no-tests=error

      - name: Configure boundary re-solve
        if: inputs.run_boundary || inputs.run_phase_set_dependencies
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/sw92_phase_assigned_boundary -B build/sw92-boundary             "${config_arg[@]}" ${{ matrix.compiler }}             -DMPMC_SW92_PHASE_ASSIGNED_BOUNDARY_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build boundary re-solve
        if: inputs.run_boundary || inputs.run_phase_set_dependencies
        run: cmake --build build/sw92-boundary --target mpmc_sw92_phase_assigned_boundary_tests --config ${{ matrix.config }} --parallel 2
      - name: Run boundary re-solve
        if: inputs.run_boundary || inputs.run_phase_set_dependencies
        run: ctest --test-dir build/sw92-boundary -C ${{ matrix.config }} -R '^flash[.]sw92_phase_assigned_boundary[.]' --verbose --no-tests=error
