name: Thermodynamics contracts

# Main-target PR path and suite selection are owned by pr_incremental_ci.yml.
# This file only executes the routed matrix or an explicit manual suite.
on:
  workflow_call:
    inputs:
      matrix_json:
        description: Audited thermodynamics matrix selected by the PR impact router.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      suite:
        description: 'Audited scope; shared environment changes require all affected suites'
        type: choice
        options: [all, contracts, pr76, pr76_mixture, pr76_pt]
        default: all

permissions:
  contents: read

concurrency:
  group: thermo-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-select:
    name: Select manual thermodynamics suite
    if: ${{ inputs.matrix_json == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - name: Build requested manual matrix
        id: scope
        shell: python
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          import json
          import os

          all_suites = ["contracts", "pr76", "pr76_mixture", "pr76_pt"]
          requested = os.environ.get("REQUESTED_SUITE") or "all"
          if requested not in ["all", *all_suites]:
              raise ValueError("Unknown thermodynamics suite")
          selected = all_suites if requested == "all" else [requested]
          platforms = [
              {"name": "GCC Debug + ASan/UBSan", "os": "ubuntu-24.04", "runner": "mpmc_hnu",
               "config": "Debug", "compiler": "-DCMAKE_CXX_COMPILER=g++", "sanitizer": "ON"},
              {"name": "Clang Release", "os": "ubuntu-24.04", "runner": "mpmc_hnu",
               "config": "Release", "compiler": "-DCMAKE_CXX_COMPILER=clang++", "sanitizer": "OFF"},
              {"name": "MSVC Release", "os": "windows-2022", "runner": "windows-2022",
               "config": "Release", "compiler": "", "sanitizer": "OFF"},
          ]
          targets = {
              "contracts": "mpmc_thermodynamics_contract_tests",
              "pr76": "mpmc_thermodynamics_pr76_tests",
              "pr76_mixture": "mpmc_thermodynamics_pr76_mixture_tests",
              "pr76_pt": "mpmc_thermodynamics_pr76_pt_tests",
          }
          matrix = {
              "include": [
                  {**platform, "suite": suite, "target": targets[suite]}
                  for suite in selected
                  for platform in platforms
              ]
          }
          print("Selected manual suites:", selected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")

  contracts:
    needs: manual-select
    if: ${{ always() && (inputs.matrix_json != '' || needs.manual-select.result == 'success') }}
    name: ${{ matrix.suite }} / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix_json != '' && inputs.matrix_json || needs.manual-select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Python interpreter
        if: matrix.suite == 'pr76_pt'
        run: |
          if command -v python >/dev/null 2>&1; then
            python_cmd="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_cmd="$(command -v python3)"
          else
            echo "Python interpreter not found" >&2
            exit 1
          fi
          echo "MPMC_PYTHON=$python_cmd" >> "$GITHUB_ENV"

      - name: Configure only the selected suite
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/thermodynamics/${{ matrix.suite }} -B build/thermo-${{ matrix.suite }} \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_THERMO_ENABLE_SANITIZERS=${{ matrix.sanitizer }}

      - name: Compile only the selected target
        run: |
          cmake --build build/thermo-${{ matrix.suite }} --target ${{ matrix.target }} \
            --config ${{ matrix.config }} --parallel 2

      - name: Run only the selected increments
        run: |
          ctest --test-dir build/thermo-${{ matrix.suite }} -C ${{ matrix.config }} \
            -R '^thermo[.]${{ matrix.suite }}[.]' --verbose --no-tests=error

      - name: Independently regenerate PT reference anchors
        if: matrix.suite == 'pr76_pt'
        run: |
          "$MPMC_PYTHON" tests/thermodynamics/pr76_pt/reference_decimal.py
