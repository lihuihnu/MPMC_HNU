name: CPA parameter-association baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/thermodynamics/include/mpmc/thermodynamics/cpa_*.hpp'
      - 'tests/thermodynamics/cpa_baseline/**'
      - '.github/workflows/cpa_baseline.yml'
      - '.github/workflows/_cpp_ctest.yml'
      - 'tests/support/cmake/cpp_test_options.cmake'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpa-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: ./.github/workflows/_cpp_ctest.yml
    with:
      source_dir: tests/thermodynamics/cpa_baseline
      build_dir: build/cpa-baseline
      targets: mpmc_cpa_baseline_tests mpmc_cpa_baseline_headers
      test_regex: '^thermodynamics[.]cpa_baseline[.]'
      sanitizer_option: MPMC_CPA_BASELINE_ENABLE_SANITIZERS
      timeout_minutes: 20
