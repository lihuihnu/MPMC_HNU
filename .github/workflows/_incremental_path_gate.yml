name: Incremental PR path gate

on:
  workflow_call:
    inputs:
      paths_json:
        required: true
        type: string
    outputs:
      affected:
        description: Whether the current PR head update touches this caller's audited paths.
        value: ${{ jobs.detect.outputs.affected }}

permissions:
  contents: read

jobs:
  detect:
    name: Current head update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.changed.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare only this PR head update
        id: changed
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PATHS_JSON: ${{ inputs.paths_json }}
        run: |
          import json
          import os
          import re
          import subprocess

          def compile_pattern(pattern):
              out = ["^"]
              i = 0
              while i < len(pattern):
                  if pattern[i:i + 3] == "**/":
                      out.append("(?:.*/)?")
                      i += 3
                  elif pattern[i:i + 2] == "**":
                      out.append(".*")
                      i += 2
                  elif pattern[i] == "*":
                      out.append("[^/]*")
                      i += 1
                  elif pattern[i] == "?":
                      out.append("[^/]")
                      i += 1
                  else:
                      out.append(re.escape(pattern[i]))
                      i += 1
              out.append("$")
              return re.compile("".join(out))

          def matches(path, patterns):
              selected = False
              for raw in patterns:
                  negative = raw.startswith("!")
                  pattern = raw[1:] if negative else raw
                  if compile_pattern(pattern).match(path):
                      selected = not negative
              return selected

          event_name = os.environ.get("EVENT_NAME", "")
          action = os.environ.get("EVENT_ACTION", "")
          patterns = json.loads(os.environ["PATHS_JSON"])
          affected = True
          changed = []

          if event_name == "pull_request" and action == "synchronize":
              before = os.environ.get("BEFORE_SHA", "")
              after = os.environ.get("AFTER_SHA", "")
              sha = re.compile(r"^[0-9a-fA-F]{40}$")
              if sha.match(before) and sha.match(after):
                  diff = subprocess.run(
                      ["git", "diff", "--name-only", "-z", before, after],
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                  )
                  if diff.returncode != 0:
                      subprocess.run(
                          ["git", "fetch", "--no-tags", "--depth=1", "origin", before, after],
                          check=False,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                      )
                      diff = subprocess.run(
                          ["git", "diff", "--name-only", "-z", before, after],
                          check=False,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                      )
                  if diff.returncode == 0:
                      changed = [
                          path
                          for path in diff.stdout.decode("utf-8").split("\0")
                          if path
                      ]
                      affected = any(matches(path, patterns) for path in changed)
                  else:
                      print("Incremental diff unavailable; failing open to run the audited gate.")
              else:
                  print("Synchronize payload did not provide valid before/after SHAs; failing open.")

          print("Incremental changed paths:", json.dumps(changed, ensure_ascii=False))
          print("Audited patterns:", json.dumps(patterns, ensure_ascii=False))
          print("Affected:", affected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"affected={'true' if affected else 'false'}\n")
