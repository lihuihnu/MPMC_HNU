name: Discretization core correctness
permissions:
  contents: read
concurrency:
  group: discretization-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  incremental-path-gate:
    name: Incremental path gate
    uses: ./.github/workflows/_incremental_path_gate.yml
    with:
      paths_json: '["modules/mesh/include/**","modules/mesh/CMakeLists.txt","modules/discretization/include/**","modules/discretization/CMakeLists.txt","modules/well/include/**","modules/well/CMakeLists.txt","tests/discretization/core/**","tests/well/core/**",".github/workflows/discretization_core.yml"]'
  core:
    needs: incremental-path-gate
    if: needs.incremental-path-gate.outputs.affected == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: GCC Debug + ASan/UBSan
          os: ubuntu-24.04
          runner: ubuntu-24.04
          build_type: Debug
          compiler: -DCMAKE_CXX_COMPILER=g++
          sanitizer: 'ON'
        - name: Clang Release
          os: ubuntu-24.04
          runner: ubuntu-24.04
          build_type: Release
          compiler: -DCMAKE_CXX_COMPILER=clang++
          sanitizer: 'OFF'
        - name: MSVC Release
          os: windows-2022
          runner: windows-2022
          build_type: Release
          compiler: ''
          sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Configure discretization core tests
      run: "cmake -S tests/discretization/core -B build/discretization-core \\\n  -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \\\n  ${{ matrix.compiler }} \\\n  -DMPMC_DISCRETIZATION_ENABLE_SANITIZERS=${{\
        \ matrix.sanitizer }}\n"
    - name: Build discretization core tests
      run: "cmake --build build/discretization-core \\\n  --target mpmc_discretization_core_all \\\n  --config ${{ matrix.build_type }} \\\n  --parallel 2\n"
    - name: Run discretization core tests
      run: "ctest --test-dir build/discretization-core \\\n  -C ${{ matrix.build_type }} \\\n  -R '^(discretization[.]core[.]|well[.]core[.])' \\\n  --verbose \\\n  --no-tests=error\n"
'on':
  workflow_dispatch: null
