name: CPA ThermoPack external oracle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cpa_thermopack_oracle.yml'
      - 'tests/flash/cpa_thermopack_oracle/**'
      - 'modules/flash/cpa_thermopack_mapping.md'
      - 'modules/flash/cpa_flash.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpa-thermopack-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-thermopack-oracle:
    name: Pinned ThermoPack SRK-CPA oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout MPMC_HNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare hosted ThermoPack build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          gfortran --version | head -n 1
          cmake --version | head -n 1
          python3 --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblapack-dev libblas-dev

      - name: Fetch pinned ThermoPack source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/thermotools/thermopack.git build/thermopack
          git -C build/thermopack checkout --detach d68c794c7342bfc6938eb424a1fbb88b7780b738
          test "$(git -C build/thermopack rev-parse HEAD)" = "d68c794c7342bfc6938eb424a1fbb88b7780b738"

      - name: Build pinned ThermoPack
        shell: bash
        run: |
          set -euo pipefail
          cmake -S build/thermopack -B build/thermopack-build -DCMAKE_BUILD_TYPE=Release
          cmake --build build/thermopack-build --parallel 2
          cmake --install build/thermopack-build

      - name: Configure ThermoPack Python wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user numpy
          python3 build/thermopack/addon/pycThermopack/map_platform_specifics.py --diffs=v3
          python3 -m pip install --disable-pip-version-check --user --no-deps build/thermopack/addon/pycThermopack/

      - name: Generate formulation-matched CPA oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/flash/cpa_thermopack_oracle/generate_oracle.py \
            --out build/cpa-thermopack-oracle.json
          test -s build/cpa-thermopack-oracle.json

      - name: Verify frozen external oracle reproducibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          actual = json.loads(Path("build/cpa-thermopack-oracle.json").read_text())
          frozen = json.loads(Path(
              "tests/flash/cpa_thermopack_oracle/thermopack_d68c794_meoh_h2o_33315k.json"
          ).read_text())

          for key in ("schema", "generator", "model"):
              if actual[key] != frozen[key]:
                  raise SystemExit(f"frozen ThermoPack oracle metadata drifted at {key}")

          if len(actual["states"]) != len(frozen["states"]):
              raise SystemExit("frozen ThermoPack oracle state count drifted")

          exact_keys = ("phase_code", "pressure_pa", "temperature_k")
          scalar_keys = (
              "beta_liquid", "beta_vapor",
              "extraction_material_balance_max_abs",
          )
          maps = ("feed", "liquid", "vapor")

          for index, (got, ref) in enumerate(zip(actual["states"], frozen["states"])):
              for key in exact_keys:
                  if got[key] != ref[key]:
                      raise SystemExit(f"oracle state {index} exact field drifted: {key}")
              for key in scalar_keys:
                  if not math.isclose(got[key], ref[key], rel_tol=2e-12, abs_tol=2e-12):
                      raise SystemExit(f"oracle state {index} scalar drifted: {key}")
              for group in maps:
                  if got[group].keys() != ref[group].keys():
                      raise SystemExit(f"oracle state {index} component keys drifted: {group}")
                  for component in got[group]:
                      if not math.isclose(
                          got[group][component], ref[group][component],
                          rel_tol=2e-12, abs_tol=2e-12,
                      ):
                          raise SystemExit(
                              f"oracle state {index} {group}/{component} drifted")

          print("THERMOPACK_CPA_FROZEN_ORACLE_OK states=5 tolerance=2e-12")
          PY

      - name: Generate phase-kernel decomposition audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/flash/cpa_thermopack_oracle/generate_phase_kernel_audit.py \
            --out build/cpa-thermopack-phase-kernel-audit.json
          test -s build/cpa-thermopack-phase-kernel-audit.json
