name: PR76 PT max-three-phase baseline

# Main-target PR path matching is owned by pr_incremental_ci.yml. This file
# only executes the routed matrix or an explicit manual validation.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr76-three-phase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  max3:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            runner: ubuntu-24.04
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            runner: ubuntu-24.04
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            runner: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Python interpreter
        shell: bash
        run: |
          if command -v python >/dev/null 2>&1; then
            python_cmd="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_cmd="$(command -v python3)"
          else
            echo "Python interpreter not found" >&2
            exit 1
          fi
          echo "MPMC_PYTHON=$python_cmd" >> "$GITHUB_ENV"

      - name: Configure PR76 max3
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/flash/pr76_three_phase \
            -B build/pr76-three-phase \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_PR76_THREE_PHASE_ENABLE_SANITIZERS=${{ matrix.sanitizer }}

      - name: Build PR76 max3
        run: cmake --build build/pr76-three-phase --target mpmc_pr76_three_phase_tests --config ${{ matrix.config }} --parallel 2

      - name: Run PR76 max3
        run: ctest --test-dir build/pr76-three-phase -C ${{ matrix.config }} -R '^flash[.]pr76_three_phase[.]' --verbose --no-tests=error

      - name: Independently verify PR76 sour-gas three-phase reference
        run: |
          "$MPMC_PYTHON" tests/flash/pr76_three_phase/reference_sour_gas_decimal.py --precision 80

      - name: Cross-check PR76 sour-gas reference precision
        if: matrix.sanitizer == 'ON'
        run: |
          "$MPMC_PYTHON" tests/flash/pr76_three_phase/reference_sour_gas_decimal.py --precision 96
