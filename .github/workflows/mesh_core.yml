name: Mesh core correctness
permissions:
  contents: read
concurrency:
  group: mesh-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  incremental-path-gate:
    name: Incremental path gate
    uses: ./.github/workflows/_incremental_path_gate.yml
    with:
      paths_json: '["modules/mesh/include/**","modules/mesh/CMakeLists.txt","tests/mesh/core/**",".github/workflows/mesh_core.yml","modules/mesh/src/**","modules/mesh/tools/**","modules/mesh/matlab/**","modules/mesh/include/mpmc/mesh/face_mesh*.hpp"]'
  core:
    needs: incremental-path-gate
    if: needs.incremental-path-gate.outputs.affected == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: GCC Debug + ASan/UBSan
          os: ubuntu-24.04
          runner: ubuntu-24.04
          build_type: Debug
          compiler: -DCMAKE_CXX_COMPILER=g++
          sanitizer: 'ON'
        - name: Clang Release
          os: ubuntu-24.04
          runner: ubuntu-24.04
          build_type: Release
          compiler: -DCMAKE_CXX_COMPILER=clang++
          sanitizer: 'OFF'
        - name: MSVC Release
          os: windows-2022
          runner: windows-2022
          build_type: Release
          compiler: ''
          sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare pinned optional HDF5 dependency
      shell: bash
      run: 'python tests/mesh/core/prepare_hdf5.py --root "$RUNNER_TEMP/mesh-hdf5"

        '
    - name: Configure mesh core tests
      run: "cmake -S tests/mesh/core -B build/mesh-core \\\n  -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \\\n  ${{ matrix.compiler }} \\\n  -DMPMC_MESH_ENABLE_SANITIZERS=${{\
        \ matrix.sanitizer }} -DMPMC_MESH_WITH_HDF5=ON -DHDF5_USE_STATIC_LIBRARIES=ON -DHDF5_ROOT=\"$RUNNER_TEMP/mesh-hdf5/install\"\n"
    - name: Build mesh core tests
      run: cmake --build build/mesh-core --target mpmc_mesh_core_all --config ${{ matrix.build_type }} --parallel 2
    - name: Run mesh core tests
      run: ctest --test-dir build/mesh-core -C ${{ matrix.build_type }} -R '^mesh[.]core[.]' --verbose --no-tests=error
'on':
  workflow_dispatch: null
