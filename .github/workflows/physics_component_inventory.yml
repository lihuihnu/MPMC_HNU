name: Physics PT component inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/physics/**'
      - 'modules/flash/include/mpmc/flash/pr76_*.hpp'
      - 'modules/flash/include/mpmc/flash/pt_*.hpp'
      - 'modules/flash/include/mpmc/flash/sw92_*.hpp'
      - 'modules/flash/include/mpmc/flash/detail/**'
      - 'modules/thermodynamics/include/mpmc/thermodynamics/**'
      - 'modules/ad/include/mpmc/ad/**'
      - 'tests/physics/component_inventory/**'
      - 'tests/flash/sw92_phase_assigned_pt/physical_sample6.hpp'
      - 'tests/support/sw92/test_support.hpp'
      - '.github/workflows/physics_component_inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-component-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + ASan/UBSan
            os: ubuntu-24.04
            config: Debug
            compiler: '-DCMAKE_CXX_COMPILER=g++'
            sanitizer: 'ON'
          - name: Clang Release
            os: ubuntu-24.04
            config: Release
            compiler: '-DCMAKE_CXX_COMPILER=clang++'
            sanitizer: 'OFF'
          - name: MSVC Release
            os: windows-2022
            config: Release
            compiler: ''
            sanitizer: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure PT component inventory regression
        run: |
          config_arg=()
          if [ "${{ runner.os }}" != Windows ]; then
            config_arg=(-DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/physics/component_inventory \
            -B build/physics-component-inventory \
            "${config_arg[@]}" ${{ matrix.compiler }} \
            -DMPMC_COMPONENT_INVENTORY_ENABLE_SANITIZERS=${{ matrix.sanitizer }}

      - name: Build PT component inventory regression
        run: cmake --build build/physics-component-inventory --target mpmc_component_inventory_tests --config ${{ matrix.config }} --parallel 2

      - name: Run PT component inventory regression
        run: ctest --test-dir build/physics-component-inventory -C ${{ matrix.config }} -R '^physics[.]component_inventory[.]' --verbose --no-tests=error
