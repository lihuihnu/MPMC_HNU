admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: pt_grpc_web
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: pt_grpc_web
                max_request_headers_kb: 16
                route_config:
                  name: pt_service_routes
                  virtual_hosts:
                    - name: pt_service
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - exact: http://localhost:5173
                          - exact: http://127.0.0.1:5173
                        allow_methods: "POST, OPTIONS"
                        allow_headers: "content-type,x-grpc-web,grpc-timeout,x-user-agent,grpc-encoding,grpc-accept-encoding"
                        expose_headers: "grpc-status,grpc-message,grpc-status-details-bin"
                        max_age: "600"
                        allow_credentials: false
                      routes:
                        - match:
                            prefix: /mpmc.runtime.v1.PtFlashService/
                          route:
                            cluster: pt_service_native_grpc
                            timeout: 125s
                            max_stream_duration:
                              grpc_timeout_header_max: 120s
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  # Binary gRPC-Web adds one five-byte data-frame header around
                  # the protobuf request. The native message limit remains 64 KiB.
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 65541
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: pt_service_native_grpc
      connect_timeout: 0.25s
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: pt_service_native_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 50051
